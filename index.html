        async function loadNextMatch() {
            await fadeAndStopAudio();

            revealedSlots = []; 
            document.getElementById('btnRollDice').disabled = false;

            if (tournBracket.length === 1 && tournNextRound.length === 0) {
                showChampionScreen(tournBracket[0]);
                return;
            }

            if (tournBracket.length < matchSize) {
                if (tournBracket.length > 0) tournNextRound.push(...tournBracket);
                
                if (tournNextRound.length === 1) {
                    showChampionScreen(tournNextRound[0]);
                    return;
                }

                tournBracket = [...tournNextRound];
                tournNextRound = [];
                tournBracket.sort(() => Math.random() - 0.5);
                currentRoundNumber++;
                currentMatchNumber = 1;
            }

            const rawParticipants = [];
            for (let i = 0; i < matchSize; i++) {
                if (tournBracket.length > 0) {
                    rawParticipants.push(tournBracket.shift());
                }
            }

            const preparedParticipants = await Promise.all(rawParticipants.map(album => fetchHitTrackForAlbum(album, false, true)));

            currentMatchAlbums = preparedParticipants;
            currentMatchVotes = currentMatchAlbums.map(() => 0);

            currentMatchAlbums.forEach(p => addToCollectionDataOnly(p));

            saveProgress();
            renderCollectionUI();
            updateTournamentSourceDropdown();

            renderBattleMatchUI();
            playTournamentCarouselTrack(0);
        }

        function highlightTournamentCard(idx) {
            currentMatchAlbums.forEach((_, i) => {
                const card = document.getElementById(`tcard-${i}`);
                const icon = document.getElementById(`tplay-icon-${i}`);
                const progressBarContainer = card ? card.querySelector('.progress-bar-container') : null;

                if (card) {
                    if (i === idx) {
                        card.classList.remove('flip-reveal');
                        card.classList.add('playing');
                    } else {
                        card.classList.remove('playing');
                    }
                }
                if (icon) {
                    icon.innerHTML = (i === idx) 
                        ? '<svg viewBox="0 0 24 24" style="padding-right:0;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>' 
                        : '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
                }
                if (progressBarContainer) {
                    progressBarContainer.style.display = (i === idx) ? 'block' : 'none';
                }
            });
        }

        function renderBattleMatchUI() {
            const totalRemaining = tournBracket.length + currentMatchAlbums.length + tournNextRound.length;
            const stageTitle = getPlayoffStageTitle(totalRemaining);
            document.getElementById('tournRoundTitle').innerText = `${stageTitle} | Match ${currentMatchNumber}${isBlindMode ? ' 🙈 Blind' : ''}`;
            document.getElementById('tournRemainingText').innerText = `Remaining: ${totalRemaining}`;

            const container = document.getElementById('matchCardsContainer');
            container.innerHTML = '';

            currentMatchAlbums.forEach((album, idx) => {
                const card = document.createElement('div');
                const isPlaying = (currentPlayingSlot === idx);
                const favClass = album.isFavorite ? 'active' : '';

                const isSlotBlind = isBlindMode && !revealedSlots.includes(idx);

                card.className = `tourn-card ${isSlotBlind ? 'blind-card' : `rarity-${escapeHtml(album.rarity)}`} ${isPlaying ? 'playing' : ''}`;
                card.id = `tcard-${idx}`;

                const escTitle = isSlotBlind ? '??? Hidden' : escapeHtml(album.title);
                const escArtist = isSlotBlind ? '??? Hidden' : escapeHtml(album.artist);
                const escTrack = isSlotBlind ? 'Hidden Preview Track' : escapeHtml(album.trackName || 'No track');
                const lvlClass = isSlotBlind ? 'lvl-color-1' : getLevelColorClass(album.level || 1);
                const progressText = getCopiesProgressText(album.pulls || 1);

                let playIconSVG = isPlaying ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';

                const coverHTML = isSlotBlind 
                    ? `<div class="blind-cover-placeholder">❓</div>`
                    : (album.cover ? `<img src="${escapeHtml(album.cover)}" class="cover-art">` : `<div class="vinyl-placeholder"><div class="ph-title">${escTitle}</div></div>`);

                let trackDisplay = (isSlotBlind || album.trackName) 
                    ? `<div class="track-preview-name" title="${escTrack}">🎵 ${escTrack}</div>`
                    : `<div class="track-preview-name" style="visibility: hidden;">🎵 Placeholder</div>`;

                const rarityDisplay = isSlotBlind ? 'BLIND' : escapeHtml(album.rarity);
                const lvlDisplay = isSlotBlind ? 'LVL ?' : `LVL ${album.level || 1}`;
                const typeDisplay = isSlotBlind ? '?' : escapeHtml(album.type);
                const scoreDisplay = isSlotBlind ? '★ -.-' : `★ ${escapeHtml(album.score)}`;
                const genreDisplay = isSlotBlind ? '🏷️ Hidden Genre | 📅 ????' : `🏷️ ${escapeHtml(album.genre)} | 📅 ${escapeHtml(album.year)}`;
                const copiesDisplay = isSlotBlind ? '🃏 ? copies' : `🃏 ${progressText} copies`;

                card.innerHTML = `
                    <div>
                        <div class="card-top-bar">
                            <div class="lvl-badge ${lvlClass}">${lvlDisplay}</div>
                            <div class="rarity-badge" style="${isSlotBlind ? 'background:#333; color:#aaa;' : ''}">${rarityDisplay}</div>
                            <div style="display:flex; gap:4px; align-items:center;">
                                <button class="shuffle-btn" onclick="shuffleTrackInTournament(${idx}, event)" title="Request another track">${SHUFFLE_SVG}</button>
                                <button class="fav-btn ${favClass}" onclick="toggleFavoriteFromTournament(${idx}, ${album.id}, event)" title="Toggle Favorite">★</button>
                            </div>
                        </div>

                        <div class="cover-wrapper" onclick="togglePlayTournamentSlot(${idx})">
                            ${coverHTML}
                            <div class="play-overlay"><div class="play-btn-icon" id="tplay-icon-${idx}"><svg viewBox="0 0 24 24">${playIconSVG}</svg></div></div>
                            <div class="progress-bar-container" style="${isPlaying ? 'display:block;' : 'display:none;'}"><div class="progress-bar-fill" id="tprogress-${idx}"></div></div>
                        </div>

                        <div class="card-details-box">
                            <div class="mini-track-container">${trackDisplay}</div>
                            <div class="artist-name" title="${escArtist}">${escArtist}</div>
                            <div class="album-title" title="${escTitle}">${escTitle}</div>
                            <div class="type-badge">${typeDisplay}</div>
                            <div class="score-badge">${scoreDisplay}</div>
                            <div class="copies-tag">${copiesDisplay}</div>
                            <div class="genre-badge" title="${genreDisplay}">${genreDisplay}</div>
                        </div>
                    </div>

                    <div style="margin-top: 4px;">
                        <div class="vote-control-bar">
                            <button class="vote-btn-step" onclick="changeVote(${idx}, -1)">-</button>
                            <span class="vote-score-val" id="tvote-val-${idx}">${currentMatchVotes[idx]} votes</span>
                            <button class="vote-btn-step" onclick="changeVote(${idx}, 1)">+</button>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            updateProbabilityBar();
        }

        function toggleFavoriteFromTournament(slotIndex, albumId, event) {
            if (event) event.stopPropagation();
            if (currentMatchAlbums[slotIndex]) currentMatchAlbums[slotIndex].isFavorite = !currentMatchAlbums[slotIndex].isFavorite;
            const item = collection.get(albumId);
            if (item) {
                item.isFavorite = !item.isFavorite;
                saveProgress();
                renderCollectionUI();
                updateTournamentSourceDropdown();
            }
            renderBattleMatchUI();
        }

        async function shuffleTrackInTournament(slotIndex, event) {
            if (event) event.stopPropagation();
            const albumData = currentMatchAlbums[slotIndex];
            if (!albumData) return;

            const icon = document.getElementById(`tplay-icon-${slotIndex}`);
            if (icon) icon.innerHTML = '⏳';

            const refreshedData = await fetchHitTrackForAlbum(albumData, true, true);
            currentMatchAlbums[slotIndex] = refreshedData;
            
            renderBattleMatchUI();
            playTournamentCarouselTrack(slotIndex);
        }

        function togglePlayTournamentSlot(idx) {
            if (currentPlayingSlot === idx && currentAudio && !currentAudio.paused) {
                pauseCurrentAudio();
            } else {
                playTournamentCarouselTrack(idx);
            }
        }

        async function playTournamentCarouselTrack(idx) {
            await fadeAndStopAudio();
            const album = currentMatchAlbums[idx];
            if (!album || !album.preview) {
                playNextMatchTrackInCarousel(idx);
                return;
            }

            currentPlayingSlot = idx;
            currentPlayingId = `tourn_${idx}`;

            highlightTournamentCard(idx);

            const newAudio = new Audio(album.preview);
            currentAudio = newAudio;

            let fadeOutTriggered = false;
            newAudio.ontimeupdate = () => {
                if (currentAudio === newAudio && newAudio.duration) {
                    const progressBar = document.getElementById(`tprogress-${idx}`);
                    if (progressBar) progressBar.style.width = `${(newAudio.currentTime / newAudio.duration) * 100}%`;

                    if (newAudio.duration - newAudio.currentTime <= 0.8 && !fadeOutTriggered) {
                        fadeOutTriggered = true;
                        const fadeInterval = setInterval(() => {
                            if (currentAudio === newAudio && newAudio.volume > 0.05) {
                                newAudio.volume = Math.max(0, newAudio.volume - 0.1);
                            } else {
                                clearInterval(fadeInterval);
                            }
                        }, 40);
                    }
                }
            };
            
            newAudio.onended = async () => {
                if (currentAudio !== newAudio) return;
                await sleep(600);
                if (currentAudio !== newAudio) return;
                
                resetTournamentSlotUI(idx);
                const nextIdx = getNextAvailableSlot(currentMatchAlbums, idx, 1);
                
                if (nextIdx === 0) {
                    for (let i = 0; i < currentMatchAlbums.length; i++) {
                        currentMatchAlbums[i] = await fetchHitTrackForAlbum(currentMatchAlbums[i], true, true);
                    }
                    renderBattleMatchUI();
                }
                
                playTournamentCarouselTrack(nextIdx);
            };

            newAudio.onerror = () => {
                if (currentAudio !== newAudio) return;
                resetTournamentSlotUI(idx);
                playNextMatchTrackInCarousel(idx);
            };

            newAudio.play().then(() => {
                if (currentAudio === newAudio) fadeInAudio(newAudio, 1.0, 500);
            }).catch(e => {
                if (currentAudio === newAudio) {
                    resetTournamentSlotUI(idx);
                    playNextMatchTrackInCarousel(idx);
                }
            });
        }

        function playNextMatchTrackInCarousel(fromIdx) {
            if (currentMatchAlbums.length === 0) return;
            const nextIdx = getNextAvailableSlot(currentMatchAlbums, fromIdx, 1);
            if (nextIdx !== fromIdx) playTournamentCarouselTrack(nextIdx);
        }

        function resetTournamentSlotUI(idx) {
            const card = document.getElementById(`tcard-${idx}`);
            const icon = document.getElementById(`tplay-icon-${idx}`);
            const progressBarContainer = card ? card.querySelector('.progress-bar-container') : null;
            const progressBar = document.getElementById(`tprogress-${idx}`);

            if (card) card.classList.remove('playing');
            if (icon) icon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
            if (progressBarContainer) progressBarContainer.style.display = 'none';
            if (progressBar) progressBar.style.width = '0%';
        }

        function changeVote(idx, delta) {
            currentMatchVotes[idx] = Math.max(0, currentMatchVotes[idx] + delta);
            const valSpan = document.getElementById(`tvote-val-${idx}`);
            if (valSpan) valSpan.innerText = `${currentMatchVotes[idx]} votes`;
            updateProbabilityBar();
        }

        function calculateProbabilities() {
            let weights = currentMatchAlbums.map((album, idx) => {
                const baseScore = parseFloat(album.score) || 3.0;
                const scoreWeight = baseScore * 10;
                const voteWeight = currentMatchVotes[idx] * 100;
                return scoreWeight + voteWeight;
            });

            const totalWeight = weights.reduce((a, b) => a + b, 0);
            return weights.map(w => (w / totalWeight));
        }

        function updateProbabilityBar() {
            const bar = document.getElementById('probabilityBar');
            bar.innerHTML = '';
            const probs = calculateProbabilities();

            probs.forEach((p, idx) => {
                const seg = document.createElement('div');
                seg.className = 'probability-segment';
                seg.style.width = `${p * 100}%`;
                seg.style.backgroundColor = SEGMENT_COLORS[idx % SEGMENT_COLORS.length];
                seg.title = `${currentMatchAlbums[idx].title}: ${(p * 100).toFixed(1)}%`;
                bar.appendChild(seg);
            });
        }

        async function rollDiceAndDetermineWinner() {
            const btn = document.getElementById('btnRollDice');
            btn.disabled = true;

            if (currentPlayingSlot !== null) {
                resetTournamentSlotUI(currentPlayingSlot);
            }

            const probs = calculateProbabilities();
            const rand = Math.random();

            let cumulative = 0;
            let winnerIdx = 0;

            for (let i = 0; i < probs.length; i++) {
                cumulative += probs[i];
                if (rand <= cumulative) {
                    winnerIdx = i;
                    break;
                }
            }

            const totalRemaining = tournBracket.length + currentMatchAlbums.length + tournNextRound.length;

            const remainingInBracket = tournBracket.length + tournNextRound.length;
            let totalTicks = 8;
            if (remainingInBracket <= 4) totalTicks = 22;
            else if (remainingInBracket <= 12) totalTicks = 14;

            for (let t = 0; t < totalTicks; t++) {
                const flashIdx = t % currentMatchAlbums.length;
                currentMatchAlbums.forEach((_, i) => {
                    const c = document.getElementById(`tcard-${i}`);
                    if (c) {
                        c.classList.toggle('winner-glow', i === flashIdx);
                        c.classList.remove('loser-dimmed');
                    }
                });
                await sleep(80 + t * 15);
            }

            if (isBlindMode) {
                currentMatchAlbums.forEach((_, i) => {
                    if (i !== winnerIdx && !revealedSlots.includes(i)) {
                        revealedSlots.push(i);
                    }
                });
                renderBattleMatchUI();
                
                await sleep(1200);
            }

            currentMatchAlbums.forEach((_, i) => {
                const c = document.getElementById(`tcard-${i}`);
                if (c) {
                    if (i === winnerIdx) {
                        c.classList.add('winner-glow');
                        c.classList.remove('loser-dimmed');
                    } else {
                        c.classList.remove('winner-glow');
                        c.classList.add('loser-dimmed');
                    }
                }
            });

            const stageName = getPlayoffStageTitle(totalRemaining);
            currentMatchAlbums.forEach((album, idx) => {
                if (idx !== winnerIdx) {
                    tournamentEliminationLog.push({
                        album: album,
                        eliminatedAtStage: stageName,
                        remainingAtElimination: totalRemaining
                    });
                }
            });

            await sleep(2000);

            const winnerAlbum = currentMatchAlbums[winnerIdx];
            tournNextRound.push(winnerAlbum);
            currentMatchNumber++;

            loadNextMatch();
        }

        function renderChampionCardUI(champion) {
            championAlbumObj = champion;
            const container = document.getElementById('championCardContainer');
            container.innerHTML = '';

            const card = document.createElement('div');
            card.className = `tourn-card rarity-${escapeHtml(champion.rarity)}`;
            card.id = `champion-card-el`;

            const escTitle = escapeHtml(champion.title);
            const escArtist = escapeHtml(champion.artist);
            const escTrack = escapeHtml(champion.trackName || 'Main Hit Track');
            const lvlClass = getLevelColorClass(champion.level || 1);
            const progressText = getCopiesProgressText(champion.pulls || 1);
            const favClass = champion.isFavorite ? 'active' : '';

            const coverHTML = champion.cover ? `<img src="${escapeHtml(champion.cover)}" class="cover-art">` : `<div class="vinyl-placeholder"><div class="ph-title">${escTitle}</div></div>`;

            card.innerHTML = `
                <div>
                    <div class="card-top-bar">
                        <div class="lvl-badge ${lvlClass}">LVL ${champion.level || 1}</div>
                        <div class="rarity-badge">${escapeHtml(champion.rarity)}</div>
                        <div style="display:flex; gap:4px; align-items:center;">
                            <button class="shuffle-btn" onclick="playChampionNextTrack(true, event)" title="Request another track">${SHUFFLE_SVG}</button>
                            <button class="fav-btn ${favClass}" id="champFavBtn" onclick="toggleFavoriteChampion(event)" title="Toggle Favorite">★</button>
                        </div>
                    </div>

                    <div class="cover-wrapper" onclick="togglePlayChampionTrack()">
                        ${coverHTML}
                        <div class="play-overlay"><div class="play-btn-icon" id="champ-play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
                        <div class="progress-bar-container"><div class="progress-bar-fill" id="champ-progress-fill"></div></div>
                    </div>

                    <div class="card-details-box">
                        <div class="mini-track-container" id="champ-track-display"><div class="track-preview-name" title="${escTrack}">🎵 ${escTrack}</div></div>
                        <div class="artist-name" title="${escArtist}">${escArtist}</div>
                        <div class="album-title" title="${escTitle}">${escTitle}</div>
                        <div class="type-badge">${escapeHtml(champion.type)}</div>
                        <div class="score-badge">★ ${escapeHtml(champion.score)}</div>
                        <div class="copies-tag">🃏 ${progressText} copies</div>
                        <div class="genre-badge" title="${escapeHtml(champion.genre)} | ${escapeHtml(champion.year)}">
                            🏷️ ${escapeHtml(champion.genre)} | 📅 ${escapeHtml(champion.year)}
                        </div>
                    </div>
                </div>
            `;

            container.appendChild(card);
            playChampionTrack();
        }

        function renderTournamentStandingsUI(champion) {
            const listContainer = document.getElementById('tournamentStandingsList');
            listContainer.innerHTML = '';

            const sortedLog = [...tournamentEliminationLog].sort((a, b) => a.remainingAtElimination - b.remainingAtElimination);
            
            const champGroup = document.createElement('div');
            champGroup.innerHTML = `<div class="stage-group-badge" style="color:#eab308; border-color:#eab308;">🥇 CHAMPION</div>`;
            champGroup.appendChild(createAlbumCardElement(champion, 'list'));
            listContainer.appendChild(champGroup);

            let currentStage = '';
            let currentGroupContainer = null;

            sortedLog.forEach(entry => {
                if (entry.eliminatedAtStage !== currentStage) {
                    currentStage = entry.eliminatedAtStage;
                    currentGroupContainer = document.createElement('div');
                    
                    let badgeLabel = currentStage;
                    if (currentStage === "🏆 FINAL") badgeLabel = "🥈 RUNNER-UP (Finalist)";

                    currentGroupContainer.innerHTML = `<div class="stage-group-badge">${badgeLabel}</div>`;
                    listContainer.appendChild(currentGroupContainer);
                }

                if (currentGroupContainer) {
                    currentGroupContainer.appendChild(createAlbumCardElement(entry.album, 'list'));
                }
            });
        }

        function toggleFavoriteChampion(event) {
            if (event) event.stopPropagation();
            if (!championAlbumObj) return;

            championAlbumObj.isFavorite = !championAlbumObj.isFavorite;
            const item = collection.get(championAlbumObj.id);
            if (item) item.isFavorite = championAlbumObj.isFavorite;

            const btn = document.getElementById('champFavBtn');
            if (btn) btn.classList.toggle('active', championAlbumObj.isFavorite);

            saveProgress();
            renderCollectionUI();
            updateTournamentSourceDropdown();
        }

        function togglePlayChampionTrack() {
            if (currentAudio && !currentAudio.paused) {
                pauseCurrentAudio();
            } else {
                playChampionTrack();
            }
        }

        async function playChampionNextTrack(forceRandom = true, event = null) {
            if (event) event.stopPropagation();
            if (!championAlbumObj) return;

            const display = document.getElementById('champ-track-display');
            if (display) display.innerHTML = `<div class="track-preview-name" style="color:#eab308;">⏳ Loading track...</div>`;

            const refreshedData = await fetchHitTrackForAlbum(championAlbumObj, forceRandom, true);
            championAlbumObj = refreshedData;
            
            if (display) display.innerHTML = `<div class="track-preview-name" title="${escapeHtml(refreshedData.trackName)}">🎵 ${escapeHtml(refreshedData.trackName)}</div>`;
            playChampionTrack();
        }

        async function playChampionTrack() {
            await fadeAndStopAudio();
            if (!championAlbumObj || !championAlbumObj.preview) return;

            currentPlayingId = `champ_${championAlbumObj.id}`;
            const card = document.getElementById('champion-card-el');
            const icon = document.getElementById('champ-play-icon');
            const progressBar = document.getElementById('champ-progress-fill');

            if (card) {
                card.classList.remove('flip-reveal');
                card.classList.add('playing');
                if (window.innerWidth <= 600) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
            if (icon) icon.innerHTML = '<svg viewBox="0 0 24 24" style="padding-right:0;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

            const newAudio = new Audio(championAlbumObj.preview);
            currentAudio = newAudio;
            
            let fadeOutTriggered = false;
            newAudio.ontimeupdate = () => {
                if (currentAudio === newAudio && newAudio.duration) {
                    if (progressBar) progressBar.style.width = `${(newAudio.currentTime / newAudio.duration) * 100}%`;

                    if (newAudio.duration - newAudio.currentTime <= 0.8 && !fadeOutTriggered) {
                        fadeOutTriggered = true;
                        const fadeInterval = setInterval(() => {
                            if (currentAudio === newAudio && newAudio.volume > 0.05) {
                                newAudio.volume = Math.max(0, newAudio.volume - 0.1);
                            } else {
                                clearInterval(fadeInterval);
                            }
                        }, 40);
                    }
                }
            };

            newAudio.onended = async () => {
                if (currentAudio !== newAudio) return;
                await sleep(600);
                if (currentAudio !== newAudio) return;
                resetChampionUI();
                playChampionNextTrack(true);
            };

            newAudio.play().then(() => {
                if (currentAudio === newAudio) fadeInAudio(newAudio, 1.0, 500);
            }).catch(e => {
                if (currentAudio === newAudio) {
                    resetChampionUI();
                }
            });
        }

        function showChampionScreen(champion) {
            stopCurrentAudio();
            addToCollectionDataOnly(champion);
            saveProgress();
            renderCollectionUI();
            updateTournamentSourceDropdown();

            document.getElementById('battleArena').classList.add('hidden');
            document.getElementById('winnerScreen').classList.remove('hidden');

            renderChampionCardUI(champion);
            renderTournamentStandingsUI(champion);
        }

        function abortTournament() {
            if (confirm('Abort current tournament?')) {
                resetTournamentUI();
            }
        }

        function resetTournamentUI() {
            stopCurrentAudio();
            championAlbumObj = null;
            tournamentEliminationLog = [];
            revealedSlots = [];
            document.getElementById('battleArena').classList.add('hidden');
            document.getElementById('winnerScreen').classList.add('hidden');
            document.getElementById('tournamentSetup').classList.remove('hidden');
            updateTournamentSourceDropdown();
        }

        window.onload = loadDatabase;
    </script>
</body>
</html>
