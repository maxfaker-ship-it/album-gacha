<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Gacha & Tournament</title>
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --rarity-common: #94a3b8;
            --rarity-rare: #3b82f6;
            --rarity-epic: #a855f7;
            --rarity-legend: #eab308;
            --lvl-1: #94a3b8;
            --lvl-2: #22c55e;
            --lvl-3: #3b82f6;
            --lvl-4: #a855f7;
            --lvl-5: #eab308;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        header {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #334155;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sync-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e293b;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #334155;
            font-size: 0.85rem;
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        .sync-status {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .sync-status.syncing { color: #eab308; }
        .sync-status.success { color: #22c55e; }

        .btn-google {
            background: #ffffff;
            color: #1f2937;
            border: none;
            padding: 6px 12px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-google:hover { background: #f3f4f6; }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: #1e293b;
            padding: 4px;
            border-radius: 8px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: #ffffff;
        }

        main {
            width: 100%;
            max-width: 1000px;
        }

        .hidden { display: none !important; }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-secondary {
            background: #334155;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-secondary:hover { background: #475569; }

        /* Card Styles */
        .pack-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card.rarity-Common { border-color: var(--rarity-common); }
        .card.rarity-Rare { border-color: var(--rarity-rare); }
        .card.rarity-Epic { border-color: var(--rarity-epic); }
        .card.rarity-Legendary { border-color: var(--rarity-legend); }

        .card.playing {
            box-shadow: 0 0 15px var(--accent-color);
            transform: scale(1.02);
        }

        .card-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.75rem;
        }

        .lvl-badge {
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            color: #0f172a;
        }

        .lvl-color-1 { background-color: var(--lvl-1); }
        .lvl-color-2 { background-color: var(--lvl-2); }
        .lvl-color-3 { background-color: var(--lvl-3); }
        .lvl-color-4 { background-color: var(--lvl-4); }
        .lvl-color-5 { background-color: var(--lvl-5); }

        .rarity-badge {
            font-weight: 700;
            text-transform: uppercase;
        }

        .fav-btn, .shuffle-btn {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .fav-btn.active { color: #eab308; }
        .shuffle-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .cover-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #0f172a;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .cover-art {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .vinyl-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            text-align: center;
            background: #1e293b;
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .cover-wrapper:hover .play-overlay { opacity: 1; }

        .play-btn-icon svg {
            width: 36px;
            height: 36px;
            fill: #ffffff;
        }

        .progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-color);
        }

        .card-details-box {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 0.8rem;
        }

        .artist-name { font-weight: 700; color: #cbd5e1; }
        .album-title { font-weight: 600; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-preview-name { color: #818cf8; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Collection Grid & List */
        .collection-stats-bar {
            display: flex;
            gap: 16px;
            background: #1e293b;
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .list-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid transparent;
        }

        .list-card.rarity-Common { border-left-color: var(--rarity-common); }
        .list-card.rarity-Rare { border-left-color: var(--rarity-rare); }
        .list-card.rarity-Epic { border-left-color: var(--rarity-epic); }
        .list-card.rarity-Legendary { border-left-color: var(--rarity-legend); }

        .list-cover-wrapper {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        /* Tournament Arena */
        .arena-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .match-cards-container {
            display: flex;
            gap: 16px;
            justify-content: center;
            width: 100%;
            flex-wrap: wrap;
        }

        .probability-bar-wrapper {
            width: 100%;
            height: 12px;
            background: #334155;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            margin-top: 10px;
        }

        .probability-segment {
            height: 100%;
            transition: width 0.3s;
        }

        /* Animations */
        .winner-glow {
            animation: pulse-glow 1s infinite alternate;
        }

        @keyframes pulse-glow {
            from { box-shadow: 0 0 10px #eab308; }
            to { box-shadow: 0 0 25px #eab308; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Album Gacha Sync</h1>
        <div class="header-actions">
            <div class="sync-box">
                <span id="syncStatus" class="sync-status">Offline</span>
                <button id="btnGoogleSignIn" class="btn-google" onclick="handleGoogleSignIn()">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                    Sign in
                </button>
                <div id="userProfile" class="hidden" style="display: flex; align-items: center; gap: 6px;">
                    <img id="userAvatar" class="user-avatar" src="" alt="User">
                    <span id="userName" style="font-weight: 600; font-size: 0.8rem;"></span>
                    <button onclick="handleGoogleSignOut()" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:0.75rem;">(Exit)</button>
                </div>
            </div>
        </div>
    </header>

    <div class="tabs">
        <button id="tabGacha" class="tab-btn active" onclick="switchMode('gacha')">📦 Gacha</button>
        <button id="tabTournament" class="tab-btn" onclick="switchMode('tournament')">🏆 Tournament</button>
    </div>

    <main>
        <!-- GACHA SECTION -->
        <section id="gachaSection">
            <div id="initialStartBox" style="text-align: center; padding: 40px 0;">
                <button id="btnInitialPull" class="btn-primary" style="font-size: 1.2rem; padding: 16px 32px;" onclick="pull5Pack()" disabled>
                    ✨ Open First 5-Pack!
                </button>
            </div>

            <div id="topControls" class="controls-bar hidden">
                <button id="pullBtn" class="btn-primary" onclick="pull5Pack()">🎲 Pull 5 Albums</button>
                <label style="font-size: 0.85rem; display: flex; align-items: center; gap: 6px; cursor: pointer;">
                    <input type="checkbox" id="autoPullCheck"> Auto-play next pack
                </label>
                <button id="btnToggleCollection" class="btn-secondary" onclick="toggleCollectionArea()">📦 Show Collection</button>
            </div>

            <div id="packArea" class="hidden">
                <div id="packContainer" class="pack-container"></div>
                <div id="bottomControls" class="controls-bar hidden" style="justify-content: center;">
                    <button id="pullBtnBottom" class="btn-primary" onclick="pull5Pack()">🎲 Pull Another Pack</button>
                </div>
            </div>

            <!-- COLLECTION AREA -->
            <div id="collectionStatsBar" class="collection-stats-bar hidden"></div>
            
            <div id="collectionControls" class="controls-bar hidden">
                <div style="display: flex; gap: 8px; align-items: center;">
                    <select id="sortSelect" onchange="renderCollectionUI()" style="background: #1e293b; color: white; border: 1px solid #334155; padding: 6px; border-radius: 6px;">
                        <option value="recent">Recent First</option>
                        <option value="pulls_desc">Level / Copies</option>
                        <option value="rarity">Rarity</option>
                        <option value="score">Score</option>
                        <option value="genre">Genre</option>
                        <option value="year">Year</option>
                    </select>
                </div>
                <div style="display: flex; gap: 4px;">
                    <button id="btnGridView" class="btn-secondary active" onclick="setViewMode('grid')">Grid</button>
                    <button id="btnArtistView" class="btn-secondary" onclick="setViewMode('artist')">Artists</button>
                    <button id="btnListView" class="btn-secondary" onclick="setViewMode('list')">List</button>
                </div>
            </div>

            <div id="collectionContainer" class="grid hidden"></div>
        </section>

        <!-- TOURNAMENT SECTION -->
        <section id="tournamentSection" class="hidden">
            <div id="tournamentSetup" style="background: #1e293b; padding: 24px; border-radius: 12px; max-width: 500px; margin: 0 auto;">
                <h2 style="margin-bottom: 16px; font-size: 1.2rem;">🏆 Tournament Setup</h2>
                <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;">
                    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem;">
                        Source Pool:
                        <select id="tournSource" style="background: #0f172a; color: white; border: 1px solid #334155; padding: 8px; border-radius: 6px;">
                            <option value="all">All Albums</option>
                            <option value="collection">My Collection Only</option>
                            <option value="favorites">Favorites Only</option>
                        </select>
                    </label>

                    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem;">
                        Participants Count:
                        <select id="tournSize" style="background: #0f172a; color: white; border: 1px solid #334155; padding: 8px; border-radius: 6px;">
                            <option value="8">8 Albums</option>
                            <option value="16" selected>16 Albums</option>
                            <option value="32">32 Albums</option>
                            <option value="64">64 Albums</option>
                        </select>
                    </label>

                    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem;">
                        Match Type:
                        <select id="tournFormat" style="background: #0f172a; color: white; border: 1px solid #334155; padding: 8px; border-radius: 6px;">
                            <option value="1v1">1 vs 1 (Duels)</option>
                            <option value="4way">4-Way Battle</option>
                        </select>
                    </label>

                    <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer;">
                        <input type="checkbox" id="tournBlindCheck"> 🙈 Blind Mode (Hide Covers & Titles)
                    </label>
                </div>

                <button id="btnStartTourn" class="btn-primary" style="width: 100%;" onclick="startTournament()">Start Tournament</button>

                <div id="tournProgressOverlay" class="hidden" style="margin-top: 16px;">
                    <div id="tournProgressText" style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px;">Checking tracks...</div>
                    <div style="width: 100%; height: 6px; background: #0f172a; border-radius: 3px; overflow: hidden;">
                        <div id="tournProgressFill" style="width: 0%; height: 100%; background: var(--accent-color);"></div>
                    </div>
                </div>
            </div>

            <!-- BATTLE ARENA -->
            <div id="battleArena" class="arena-container hidden">
                <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                    <button class="btn-secondary" onclick="abortTournament()">❌ Abort</button>
                    <h2 id="tournRoundTitle" style="font-size: 1.1rem; color: #818cf8;">Round 1</h2>
                    <span id="tournRemainingText" style="font-size: 0.85rem; color: #94a3b8;">Remaining: 16</span>
                </div>

                <div id="matchCardsContainer" class="match-cards-container"></div>

                <div style="width: 100%; max-width: 600px; text-align: center;">
                    <div class="probability-bar-wrapper" id="probabilityBar"></div>
                    <button id="btnRollDice" class="btn-primary" style="margin-top: 16px; width: 100%; font-size: 1.1rem;" onclick="rollDiceAndDetermineWinner()">
                        🎲 Vote & Roll Winner
                    </button>
                </div>
            </div>

            <!-- WINNER SCREEN -->
            <div id="winnerScreen" class="hidden" style="text-align: center;">
                <h2 style="font-size: 1.8rem; color: #eab308; margin-bottom: 16px;">👑 Tournament Champion!</h2>
                <div id="championCardContainer" style="display: flex; justify-content: center; margin-bottom: 24px;"></div>
                <div style="display: flex; gap: 12px; justify-content: center; margin-bottom: 32px;">
                    <button class="btn-primary" onclick="startTournamentWithSameRules()">🔄 Play Again</button>
                    <button class="btn-secondary" onclick="resetTournamentUI()">⚙️ New Setup</button>
                </div>
                <h3>📊 Full Standings</h3>
                <div id="tournamentStandingsList" class="list" style="margin-top: 16px; text-align: left;"></div>
            </div>
        </section>
    </main>

    <script>
        // ==========================================
        // GOOGLE DRIVE SYNC MODULE CONFIGURATION
        // ==========================================
        // ⚠️ ВСТАВЬТЕ ВАШ CLIENT ID СЮДА:
        const GOOGLE_CLIENT_ID = '256537268177-rit3tcmoshjauubt7pl0l23jhfqoa9tf.apps.googleusercontent.com';
        const DRIVE_SAVE_FILENAME = 'gacha_save.json';
        
        let accessToken = null;
        let tokenClient = null;
        let googleUser = null;
        let cloudFileId = null;

        function initGoogleSync() {
            if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) return;

            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/drive.appdata openid profile email',
                callback: async (response) => {
                    if (response.error !== undefined) {
                        console.error('Google OAuth error:', response);
                        updateSyncUI('error', 'Auth Failed');
                        return;
                    }
                    accessToken = response.access_token;
                    localStorage.setItem('gacha_google_token', accessToken);
                    await fetchUserProfile();
                    await syncDataWithCloud(true);
                },
            });

            const savedToken = localStorage.getItem('gacha_google_token');
            if (savedToken) {
                accessToken = savedToken;
                fetchUserProfile().then(() => syncDataWithCloud(false)).catch(() => {
                    handleGoogleSignOut();
                });
            }
        }

        function handleGoogleSignIn() {
            if (!tokenClient) {
                alert('Google SDK is loading or Client ID is missing. Please check GOOGLE_CLIENT_ID in the script!');
                return;
            }
            tokenClient.requestAccessToken({ prompt: 'consent' });
        }

        function handleGoogleSignOut() {
            accessToken = null;
            googleUser = null;
            cloudFileId = null;
            localStorage.removeItem('gacha_google_token');
            
            document.getElementById('btnGoogleSignIn').classList.remove('hidden');
            document.getElementById('userProfile').classList.add('hidden');
        }

        async function fetchUserProfile() {
            try {
                const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                    headers: { Authorization: `Bearer ${accessToken}` }
                });
                if (!res.ok) throw new Error('Token expired');
                googleUser = await res.json();

                document.getElementById('btnGoogleSignIn').classList.add('hidden');
                document.getElementById('userProfile').classList.remove('hidden');
                document.getElementById('userAvatar').src = googleUser.picture || '';
                document.getElementById('userName').innerText = googleUser.given_name || googleUser.name || 'User';
            } catch (e) {
                console.error('Failed to fetch user profile:', e);
                handleGoogleSignOut();
            }
        }

        function updateSyncUI(state, text = '') {
            const statusEl = document.getElementById('syncStatus');
            if (!statusEl) return;
            statusEl.className = 'sync-status';
            if (state === 'syncing') {
                statusEl.classList.add('syncing');
                statusEl.innerText = '⏳ Syncing...';
            } else if (state === 'success') {
                statusEl.classList.add('success');
                statusEl.innerText = text || '✓ Synced';
            } else {
                statusEl.innerText = text || 'Offline';
            }
        }

        async function findCloudSaveFile() {
            if (!accessToken) return null;
            try {
                const query = encodeURIComponent(`name = '${DRIVE_SAVE_FILENAME}' and 'appDataFolder' in parents and trashed = false`);
                const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${query}&spaces=appDataFolder`, {
                    headers: { Authorization: `Bearer ${accessToken}` }
                });
                const data = await res.json();
                if (data.files && data.files.length > 0) {
                    cloudFileId = data.files[0].id;
                    return cloudFileId;
                }
            } catch (e) {
                console.error('Error finding cloud save file:', e);
            }
            return null;
        }

        async function loadCloudSaveData() {
            if (!accessToken) return null;
            const fileId = cloudFileId || await findCloudSaveFile();
            if (!fileId) return null;

            try {
                const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
                    headers: { Authorization: `Bearer ${accessToken}` }
                });
                if (res.ok) {
                    return await res.json();
                }
            } catch (e) {
                console.error('Error reading cloud save data:', e);
            }
            return null;
        }

        async function saveCloudData(serializableCollection) {
            if (!accessToken) return;
            updateSyncUI('syncing');

            const payload = {
                updatedAt: Date.now(),
                version: 1,
                collection: serializableCollection
            };

            const fileId = cloudFileId || await findCloudSaveFile();
            const fileContent = JSON.stringify(payload);

            try {
                if (fileId) {

                    };
                    const form = new FormData();
                    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                    form.append('file', new Blob([fileContent], { type: 'application/json' }));

                    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {

        function mergeCollections(localMap, remoteArray) {
            const merged = new Map(localMap);
            if (!remoteArray || !Array.isArray(remoteArray)) return merged;

            remoteArray.forEach(([id, remoteItem]) => {
                const localItem = merged.get(id);
                if (!localItem) {
                    merged.set(id, remoteItem);
                } else {
                    const maxPulls = Math.max(localItem.pulls || 1, remoteItem.pulls || 1);
                    merged.set(id, {
                        ...localItem,
                        ...remoteItem,
                        pulls: maxPulls,
                        level: calculateLevel(maxPulls),
                        isFavorite: localItem.isFavorite || remoteItem.isFavorite,
                        pulledAt: Math.max(localItem.pulledAt || 0, remoteItem.pulledAt || 0)
                    });
                }
            });

            return merged;
        }

        function initSwipeListeners() {
            const packContainer = document.getElementById('packContainer');
            const matchContainer = document.getElementById('matchCardsContainer');
            const colContainer = document.getElementById('collectionContainer');

            [packContainer, matchContainer, colContainer].forEach(container => {
                if (!container) return;
                container.addEventListener('touchstart', e => {
                    touchStartX = e.changedTouches[0].clientX;
                    touchStartY = e.changedTouches[0].clientY;
                }, { passive: true });

                container.addEventListener('touchmove', e => {
                    const currentX = e.changedTouches[0].clientX;
                    const currentY = e.changedTouches[0].clientY;
                    const diffX = Math.abs(currentX - touchStartX);
                    const diffY = Math.abs(currentY - touchStartY);

                    if (diffX > diffY && diffX > 10) {
                        if (e.cancelable) e.preventDefault();
                    }
                }, { passive: false });

                container.addEventListener('touchend', e => {
                    const touchEndX = e.changedTouches[0].clientX;
                    const touchEndY = e.changedTouches[0].clientY;
                    handleSwipeGesture(container, touchStartX, touchEndX, touchStartY, touchEndY);
                }, { passive: true });
            });
        }

        function getNextAvailableSlot(list, currentSlot, direction) {
            if (!list || list.length === 0) return 0;
            const len = list.length;
            let checkSlot = currentSlot;
            for (let i = 0; i < len; i++) {
                checkSlot = (checkSlot + direction + len) % len;
                if (list[checkSlot] && list[checkSlot].preview) {
                    return checkSlot;
                }
            }
            return currentSlot;
        }

        function handleSwipeGesture(container, startX, endX, startY, endY) {
            const diffX = endX - startX;
            const diffY = endY - startY;

            if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY) * 1.2) {
                if (container.id === 'packContainer' && currentPackData.length > 0) {
                    let currentSlot = currentPlayingSlot !== null ? currentPlayingSlot : 0;
                    const dir = (diffX < 0) ? 1 : -1;
                    const targetSlot = getNextAvailableSlot(currentPackData, currentSlot, dir);
                    playSlot(targetSlot);
                } else if (container.id === 'matchCardsContainer' && currentMatchAlbums.length > 0) {
                    let currentSlot = currentPlayingSlot !== null ? currentPlayingSlot : 0;
                    const dir = (diffX < 0) ? 1 : -1;
                    const targetSlot = getNextAvailableSlot(currentMatchAlbums, currentSlot, dir);
                    playTournamentCarouselTrack(targetSlot);
                } else if (container.id === 'collectionContainer' && collection.size > 0) {
                    const albumsArray = Array.from(collection.values());
                    let currentIndex = 0;
                    if (currentPlayingId && currentPlayingId.startsWith('col_')) {
                        const playingId = parseInt(currentPlayingId.replace('col_', ''), 10);
                        currentIndex = albumsArray.findIndex(a => a.id === playingId);
                        if (currentIndex === -1) currentIndex = 0;
                    }
                    const dir = (diffX < 0) ? 1 : -1;
                    const nextIndex = (currentIndex + dir + albumsArray.length) % albumsArray.length;
                    playCollectionAlbum(albumsArray[nextIndex].id, false);
                }
            }
        }

        function normalizeStr(str) {
            if (!str) return '';
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/gi, '').trim();
        }
        
        function cleanQueryString(str) {
            if (!str) return '';
            return str.replace(/\[.*?\]/g, '').replace(/\(.*?\)/g, '').replace(/[-_]/g, ' ').trim();
        }

        function jsonpFetch(url) {
            return new Promise((resolve) => {
                const script = document.createElement('script');
                const callbackName = `jsonpCb_${Date.now()}_${Math.floor(Math.random() * 100000)}`;

                window[callbackName] = function(data) {
                    delete window[callbackName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    resolve(data);
                };
                script.onerror = function() {
                    delete window[callbackName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    resolve(null);
                };

                const joinChar = url.includes('?') ? '&' : '?';
                script.src = `${url}${joinChar}callback=${callbackName}`;
                document.body.appendChild(script);
            });
        }

        async function verifyAudioUrl(url) {
            if (!url) return false;
            return new Promise((resolve) => {
                const audio = new Audio();
                const timer = setTimeout(() => { audio.src = ''; resolve(false); }, 2500);
                audio.oncanplaythrough = () => { clearTimeout(timer); audio.src = ''; resolve(true); };
                audio.onerror = () => { clearTimeout(timer); audio.src = ''; resolve(false); };
                audio.src = url;
            });
        }

        async function verifyAlbumHasPreview(albumData) {
            const cleanArtist = cleanQueryString(albumData.artist);
            const cleanTitle = cleanQueryString(albumData.title);
            const targetNormArtist = normalizeStr(cleanArtist);

            const isStrictMatch = (fetchedArtist) => {
                const fetchedNorm = normalizeStr(fetchedArtist);
                return fetchedNorm === targetNormArtist || fetchedNorm.includes(targetNormArtist) || targetNormArtist.includes(fetchedNorm);
            };

            try {
                const dzData = await jsonpFetch(`https://api.deezer.com/search/album?q=${encodeURIComponent(`${cleanArtist} ${cleanTitle}`)}&limit=5&output=jsonp`);
                if (dzData && dzData.data && dzData.data.length > 0) {
                    let match = dzData.data.find(a => isStrictMatch(a.artist.name)) || dzData.data[0];
                    if (match && match.id) {
                        const tracksData = await jsonpFetch(`https://api.deezer.com/album/${match.id}/tracks?output=jsonp`);
                        if (tracksData && tracksData.data && tracksData.data.some(s => Boolean(s.preview))) return true;
                    }
                }
            } catch (e) {}

            try {
                const itunesData = await jsonpFetch(`https://itunes.apple.com/search?term=${encodeURIComponent(`${cleanArtist} ${cleanTitle}`)}&entity=song&limit=15`);
                if (itunesData && itunesData.results && itunesData.results.some(s => Boolean(s.previewUrl) && isStrictMatch(s.artistName))) {
                    return true;
                }
            } catch (e) {}

            return false;
        }

        async function fetchHitTrackForAlbum(albumData, forceRandom = false, preserveLevel = false) {
            const cleanArtist = cleanQueryString(albumData.artist);
            const cleanTitle = cleanQueryString(albumData.title);
            const targetNormArtist = normalizeStr(cleanArtist);

            const isStrictMatch = (fetchedArtist) => {
                const fetchedNorm = normalizeStr(fetchedArtist);
                return fetchedNorm === targetNormArtist || fetchedNorm.includes(targetNormArtist) || targetNormArtist.includes(fetchedNorm);
            };

            const existingEntry = collection.get(albumData.id);
            const oldPulls = existingEntry ? existingEntry.pulls : 0;
            const newPulls = preserveLevel ? (albumData.pulls || oldPulls || 1) : oldPulls + 1;
            
            const oldLevel = calculateLevel(oldPulls);
            const newLevel = calculateLevel(newPulls);
            const isLevelUp = !preserveLevel && (newLevel > oldLevel) && (oldPulls > 0);
                
            let coverUrl = existingEntry ? existingEntry.cover : (albumData.cover || '');
            let hitTrack = null;

            try {
                const dzData = await jsonpFetch(`https://api.deezer.com/search/album?q=${encodeURIComponent(`${cleanArtist} ${cleanTitle}`)}&limit=5&output=jsonp`);
                if (dzData && dzData.data && dzData.data.length > 0) {
                    let match = dzData.data.find(a => isStrictMatch(a.artist.name));
                    if (!match) match = dzData.data[0];

                    if (!coverUrl && match.cover_xl) coverUrl = match.cover_xl || match.cover_big;
                    if (match.id) {
                        const tracksData = await jsonpFetch(`https://api.deezer.com/album/${match.id}/tracks?output=jsonp`);
                        if (tracksData && tracksData.data && tracksData.data.length > 0) {
                            let validTracks = tracksData.data.filter(s => s.preview);
                            
                            if (validTracks.length > 1) {
                                validTracks = validTracks.filter((t, index) => index > 0 && t.track_position !== 1);
                            }

                            if (validTracks.length > 0) {
                                if (forceRandom && albumData.trackName && validTracks.length > 1) {
                                    validTracks = validTracks.filter(t => t.title !== albumData.trackName);
                                }
                                if (forceRandom) validTracks.sort(() => Math.random() - 0.5);

                                for (const selected of validTracks) {
                                    const isOk = await verifyAudioUrl(selected.preview);
                                    if (isOk) {
                                        hitTrack = { name: selected.title, preview: selected.preview };
                                        break;
                                    }
                                }
                            }
                        }
                    }
                }
            } catch (e) { console.log('Deezer fetch err'); }

            if (!hitTrack) {
                try {
                    const itunesData = await jsonpFetch(`https://itunes.apple.com/search?term=${encodeURIComponent(`${cleanArtist} ${cleanTitle}`)}&entity=song&limit=20`);
                    if (itunesData && itunesData.results && itunesData.results.length > 0) {
                        let validSongs = itunesData.results.filter(s => s.previewUrl && isStrictMatch(s.artistName));
                        
                        if (validSongs.length > 1) {
                            validSongs = validSongs.filter(s => s.trackNumber !== 1);
                        }

                        if (validSongs.length > 0) {
                            if (forceRandom && albumData.trackName && validSongs.length > 1) {
                                validSongs = validSongs.filter(s => s.trackName !== albumData.trackName);
                            }
                            if (forceRandom) validSongs.sort(() => Math.random() - 0.5);

                            for (const selected of validSongs) {
                                if (!coverUrl && selected.artworkUrl100) coverUrl = selected.artworkUrl100.replace('100x100bb', '600x600bb');
                                const isOk = await verifyAudioUrl(selected.previewUrl);
                                if (isOk) {
                                    hitTrack = { name: selected.trackName, preview: selected.previewUrl };
                                    break;
                                }
                            }
                        }
                    }
                } catch (e) { console.log('iTunes fetch err'); }
            }

            const isFav = existingEntry ? Boolean(existingEntry.isFavorite) : Boolean(albumData.isFavorite);

            return {
                ...albumData,
                pulls: newPulls,
                level: newLevel,
                isLevelUp: isLevelUp,
                isFavorite: isFav,
                cover: coverUrl,
                preview: hitTrack ? hitTrack.preview : '',
                trackName: hitTrack ? hitTrack.name : '',
                pulledAt: albumData.pulledAt || (Date.now() + Math.random())
            };
        }

        async function fadeInAudio(audioObj, targetVolume = 1.0, duration = 500) {
            if (!audioObj) return;
            audioObj.volume = 0.0;
            const steps = 20;
            const stepTime = duration / steps;
            const volumeIncrement = targetVolume / steps;

            for (let i = 0; i < steps; i++) {
                if (!currentAudio || currentAudio !== audioObj) break;
                audioObj.volume = Math.min(targetVolume, audioObj.volume + volumeIncrement);
                await sleep(stepTime);
            }
        }

        async function playSlot(slotIndex) {
            await fadeAndStopAudio();
            const albumData = currentPackData[slotIndex];
            if (!albumData || !albumData.preview) { playNextSlotInCarousel(slotIndex); return; }

            currentPlayingSlot = slotIndex;
            currentPlayingId = `pack_${albumData.id}`;

            const card = document.getElementById(`pack-card-${slotIndex}`);
            const icon = document.getElementById(`play-icon-${slotIndex}`);
            const progressBar = document.getElementById(`progress-${slotIndex}`);

            if (card) {
                card.classList.remove('flip-reveal');
                card.classList.add('playing');
                if (window.innerWidth <= 600) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
            if (icon) icon.innerHTML = '<svg viewBox="0 0 24 24" style="padding-right:0;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

            const newAudio = new Audio(albumData.preview);
            currentAudio = newAudio;
            
            let fadeOutTriggered = false;
            newAudio.ontimeupdate = () => {
                if (currentAudio === newAudio && newAudio.duration) {
                    if (progressBar) progressBar.style.width = `${(newAudio.currentTime / newAudio.duration) * 100}%`;
                    
                    if (newAudio.duration - newAudio.currentTime <= 0.8 && !fadeOutTriggered) {
                        fadeOutTriggered = true;
                        const fadeInterval = setInterval(() => {
                            if (currentAudio === newAudio && newAudio.volume > 0.05) {
                                newAudio.volume = Math.max(0, newAudio.volume - 0.1);
                            } else {
                                clearInterval(fadeInterval);
                            }
                        }, 40);
                    }
                }
            };
            
            newAudio.onended = async () => {
                if (currentAudio !== newAudio) return;
                await sleep(600);
                if (currentAudio !== newAudio) return;
                
                resetSlotUI(slotIndex);
                const nextSlot = (slotIndex + 1) % 5;
                const isAutoPullEnabled = document.getElementById('autoPullCheck') ? document.getElementById('autoPullCheck').checked : false;

                if (nextSlot === 0 && isAutoPullEnabled) {
                    pull5Pack();
                } else {
                    if (nextSlot === 0) {
                        for (let i = 0; i < 5; i++) {
                            if (currentPackData[i]) {
                                currentPackData[i] = await fetchHitTrackForAlbum(currentPackData[i], true, true);
                                revealCardInPack(currentPackData[i], i);
                            }
                        }
                    }
                    playSlot(nextSlot);
                }
            };

            newAudio.onerror = () => {
                if (currentAudio !== newAudio) return;
                resetSlotUI(slotIndex); 
                playNextSlotInCarousel(slotIndex);
            };

            newAudio.play().then(() => {
                if (currentAudio === newAudio) fadeInAudio(newAudio, 1.0, 500);
            }).catch(e => { 
                if (currentAudio === newAudio) {
                    resetSlotUI(slotIndex); 
                    playNextSlotInCarousel(slotIndex); 
                }
            });
            renderCollectionUI();
        }

        function playNextSlotInCarousel(fromSlotIndex) {
            if (currentPackData.length === 0) return;
            const nextSlot = getNextAvailableSlot(currentPackData, fromSlotIndex, 1);
            if (nextSlot !== fromSlotIndex) playSlot(nextSlot);
        }

            if (event) event.stopPropagation();
            const trackKey = `col_${albumId}`;

            if (!forceNextTrack && currentPlayingId === trackKey && currentAudio && !currentAudio.paused) {
                pauseCurrentAudio(); renderCollectionUI(); return;
            }
            await fadeAndStopAudio();

            const album = collection.get(albumId);
            if (!album) return;

            loadingCollectionId = albumId; renderCollectionUI();
            const refreshedData = await fetchHitTrackForAlbum(album, forceNextTrack, true);
            loadingCollectionId = null;

            if (refreshedData && refreshedData.preview) {
                collectionTracksCache.set(albumId, refreshedData.trackName || 'Preview Track');
                currentPlayingId = trackKey;
                
                const newAudio = new Audio(refreshedData.preview);
                currentAudio = newAudio;

                let fadeOutTriggered = false;
                newAudio.ontimeupdate = () => {
                    if (currentAudio === newAudio && newAudio.duration) {
                        const progressBar = document.getElementById(`col-progress-${albumId}`);
                        if (progressBar) progressBar.style.width = `${(newAudio.currentTime / newAudio.duration) * 100}%`;

                        if (newAudio.duration - newAudio.currentTime <= 0.8 && !fadeOutTriggered) {
                            fadeOutTriggered = true;
                            const fadeInterval = setInterval(() => {
                                if (currentAudio === newAudio && newAudio.volume > 0.05) {
                                    newAudio.volume = Math.max(0, newAudio.volume - 0.1);
                                } else {
                                    clearInterval(fadeInterval);
                                }
                            }, 40);
                        }
                    }
                };
                newAudio.onended = async () => { 
                    if (currentAudio !== newAudio) return;
                    await sleep(600);
                    if (currentAudio !== newAudio) return;
                    currentPlayingId = null; 
                    renderCollectionUI(); 
                };
                newAudio.play().then(() => {
                    if (currentAudio === newAudio) fadeInAudio(newAudio, 1.0, 500);
                }).catch(e => { 
                    if (currentAudio === newAudio) {
                        currentPlayingId = null; 
                        renderCollectionUI(); 
                    }
                });
            } else { alert('Audio preview not available right now.'); }
            renderCollectionUI();
        }

        async function fadeAndStopAudio() {
            const slotToReset = currentPlayingSlot;
            
            currentPlayingSlot = null; 
            currentPlayingId = null;
            loadingCollectionId = null;

            if (slotToReset !== null) {
                resetSlotUI(slotToReset);
                resetTournamentSlotUI(slotToReset);
            }

            resetChampionUI();

            if (currentAudio) {
                const aud = currentAudio;
                currentAudio = null;
                aud.onended = null;
                aud.onerror = null;
                
                try {
                    let vol = aud.volume;
                    const steps = 15;
                    const volStep = vol / steps;
                    for (let i = 0; i < steps; i++) {
                        vol = Math.max(0, vol - volStep);
                        aud.volume = vol;
                        await sleep(20);
                    }
                    aud.pause();
                } catch(e) {
                    aud.pause();
                }
            }
        }

                albumsArray.sort((a, b) => {
                    if (a.isFavorite && !b.isFavorite) return -1;
                    if (!a.isFavorite && b.isFavorite) return 1;
                    return sortFn(a, b);
                });
            };

            if (sortMode === 'pulls_desc') sortWithFavs((a, b) => b.level - a.level || b.pulls - a.pulls);
            else if (sortMode === 'copies_desc') sortWithFavs((a, b) => (b.pulls || 1) - (a.pulls || 1));
            else if (sortMode === 'rarity') sortWithFavs((a, b) => RARITY_ORDER[b.rarity] - RARITY_ORDER[a.rarity]);
            else if (sortMode === 'score') sortWithFavs((a, b) => parseFloat(b.score) - parseFloat(a.score));
            else if (sortMode === 'genre') sortWithFavs((a, b) => a.genre.localeCompare(b.genre));
            else if (sortMode === 'year') sortWithFavs((a, b) => (b.year === 'N/A' ? 0 : b.year) - (a.year === 'N/A' ? 0 : a.year));
            else sortWithFavs((a, b) => b.pulledAt - a.pulledAt);

            if (remainingCount <= 2) return "🏆 FINAL";
            if (remainingCount <= 4) return "🔥 Semi-Finals";
            if (remainingCount <= 8) return "⚡ Quarter-Finals";
            if (remainingCount <= 16) return "🥊 Round of 16";
            if (remainingCount <= 32) return "🎯 Round of 32";
            if (remainingCount <= 64) return "🎲 Round of 64";

        async function startTournament() {
            const source = document.getElementById('tournSource').value;
            const targetSize = parseInt(document.getElementById('tournSize').value, 10);
            const format = document.getElementById('tournFormat').value;
            isBlindMode = document.getElementById('tournBlindCheck').checked;

            const btn = document.getElementById('btnStartTourn');
            const progressOverlay = document.getElementById('tournProgressOverlay');
            const progressFill = document.getElementById('tournProgressFill');
            const progressText = document.getElementById('tournProgressText');

            matchSize = (format === '4way') ? 4 : 2;

            let pool = [];
            if (source === 'collection') pool = Array.from(collection.values());
            else if (source === 'favorites') pool = Array.from(collection.values()).filter(a => a.isFavorite);
            else pool = [...allAlbums];

            if (pool.length < targetSize) {
                alert(`Not enough albums in selected pool (${pool.length} available). Please select at least ${targetSize} albums or reduce bracket size!`);
                return;
            }

            document.getElementById('winnerScreen').classList.add('hidden');
            document.getElementById('tournamentSetup').classList.remove('hidden');

            btn.disabled = true;
            progressOverlay.classList.remove('hidden');
            progressFill.style.width = '0%';
            progressText.innerText = `Validating audio preview sources... (0 / ${targetSize})`;

            pool.sort(() => Math.random() - 0.5);

            const validBracket = [];
            const chunkSize = 5;

            for (let i = 0; i < pool.length; i += chunkSize) {
                if (validBracket.length >= targetSize) break;

                const chunk = pool.slice(i, i + chunkSize);
                const checks = await Promise.all(chunk.map(album => verifyAlbumHasPreview(album)));

                for (let j = 0; j < chunk.length; j++) {
                    if (checks[j] && validBracket.length < targetSize) {
                        validBracket.push(chunk[j]);
                    }
                }

                const currentPercent = Math.min(100, Math.round((validBracket.length / targetSize) * 100));
                progressFill.style.width = `${currentPercent}%`;
                progressText.innerText = `Validating participants: ${validBracket.length} of ${targetSize} (${currentPercent}%)`;

                await new Promise(r => requestAnimationFrame(r));
            }

            progressOverlay.classList.add('hidden');
            btn.disabled = false;

            if (validBracket.length < targetSize) {
                alert(`Could only find ${validBracket.length} albums with working audio previews out of ${targetSize} requested. Starting with ${validBracket.length} participants.`);
            }

            if (validBracket.length < matchSize) {
                alert('Not enough valid albums found with playable previews.');
                return;
            }

            tournBracket = validBracket;
            tournNextRound = [];
            tournamentEliminationLog = [];
            totalTournParticipants = validBracket.length;

            currentRoundNumber = 1;
            currentMatchNumber = 1;

            document.getElementById('tournamentSetup').classList.add('hidden');
            document.getElementById('winnerScreen').classList.add('hidden');
            document.getElementById('battleArena').classList.remove('hidden');

            loadNextMatch();
        }
