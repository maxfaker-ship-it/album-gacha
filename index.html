<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Album Gacha 5x Pack Pro & Tournament Pro</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --text-color: #f0f0f5;
            --rarity-common: #a0a0a0;
            --rarity-rare: #3b82f6;
            --rarity-epic: #a855f7;
            --rarity-legend: #eab308;
            --accent-color: #6366f1;
            
            --lvl-1-color: #a0a0a0;
            --lvl-2-color: #4ade80;
            --lvl-3-color: #60a5fa;
            --lvl-4-color: #c084fc;
            --lvl-5-color: #facc15;

            --winner-color: #ef4444;
        }

        html, body {
            max-width: 100vw;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 6px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header-container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 1300px;
            margin-bottom: 4px;
        }

        h1 { margin: 0 0 1px 0; font-size: 1.2rem; }
        
        p.sub { 
            color: #888; 
            margin-top: 0; 
            margin-bottom: 4px; 
            font-size: 0.65rem; 
            text-transform: uppercase;
            letter-spacing: 1.2px;
            opacity: 0.75;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            padding: 1px 0;
        }

        .mode-tabs {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .tab-btn {
            background: #1e1e24;
            color: #888;
            border: 1px solid #333;
            padding: 4px 14px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        }

        .view-section {
            width: 100%;
            max-width: 1300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hidden { display: none !important; }

        .controls { 
            margin-bottom: 0; 
            display: flex; 
            gap: 12px; 
            align-items: center; 
            justify-content: center; 
            flex-wrap: wrap;
        }

        .auto-pull-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #1e1e24;
            border: 1px solid #333;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            color: #aaa;
            cursor: pointer;
            user-select: none;
        }

        .auto-pull-toggle input {
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        button.pull-btn, button.action-btn {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 8px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
        }

        button.pull-btn:hover, button.action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(168, 85, 247, 0.6);
        }

        button.pull-btn:disabled, button.action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        button.pull-btn-large {
            padding: 14px 36px;
            font-size: 1.1rem;
            border-radius: 28px;
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
        }

        .initial-start-box {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 260px;
            width: 100%;
        }

        button.reset-btn {
            background: #2a2a35;
            color: #888;
            border: 1px solid #333;
            padding: 4px 8px;
            font-size: 0.7rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        button.reset-btn:hover {
            background: #3a2a35;
            color: #ff5555;
            border-color: #ff5555;
        }

        .pack-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pack-container {
            display: flex;
            flex-direction: row;
            gap: 10px;
            justify-content: space-between;
            align-items: stretch;
            margin: 15px 0;
            width: 100%;
            max-width: 1300px;
            box-sizing: border-box;
            min-height: 330px;
        }

        .card, .mini-card, .list-card, .tourn-card {
            container-type: inline-size;
        }

        .card {
            flex: 1;
            min-width: 0;
            background: var(--card-bg);
            border-radius: 10px;
            padding: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            text-align: center;
            border: 2px solid var(--rarity-common);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            height: 100%;
            position: relative;
        }

        .card.playing, .tourn-card.playing {
            transform: translateY(-4px) scale(1.01);
            z-index: 5;
        }

        .card.skeleton {
            border-color: #333;
            background: #18181c;
            opacity: 0.6;
        }

        .card.flip-reveal {
            animation: flip 0.25s ease-out forwards;
        }

        @keyframes flip {
            0% { transform: rotateY(90deg) scale(0.92); opacity: 0.3; }
            100% { transform: rotateY(0deg) scale(1); opacity: 1; }
        }

        .card.rarity-Common, .mini-card.rarity-Common, .tourn-card.rarity-Common { border-color: var(--rarity-common); }
        .card.rarity-Rare, .mini-card.rarity-Rare, .tourn-card.rarity-Rare { border-color: var(--rarity-rare); }
        .card.rarity-Epic, .mini-card.rarity-Epic, .tourn-card.rarity-Epic { border-color: var(--rarity-epic); }
        .card.rarity-Legendary, .mini-card.rarity-Legendary, .tourn-card.rarity-Legendary { border-color: var(--rarity-legend); }

        .list-card.rarity-Common { border-left-color: var(--rarity-common); }
        .list-card.rarity-Rare { border-left-color: var(--rarity-rare); }
        .list-card.rarity-Epic { border-left-color: var(--rarity-epic); }
        .list-card.rarity-Legendary { border-left-color: var(--rarity-legend); }

        .tourn-card.blind-card { border-color: #3e3e4a; }

        .card.playing.rarity-Common, .mini-card.playing.rarity-Common, .list-card.playing.rarity-Common, .tourn-card.playing.rarity-Common { 
            box-shadow: 0 8px 25px rgba(160, 160, 160, 0.6), 0 0 12px var(--rarity-common); 
        }
        .card.playing.rarity-Rare, .mini-card.playing.rarity-Rare, .list-card.playing.rarity-Rare, .tourn-card.playing.rarity-Rare { 
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.8), 0 0 16px var(--rarity-rare); 
        }
        .card.playing.rarity-Epic, .mini-card.playing.rarity-Epic, .list-card.playing.rarity-Epic, .tourn-card.playing.rarity-Epic { 
            box-shadow: 0 8px 32px rgba(168, 85, 247, 0.9), 0 0 20px var(--rarity-epic); 
        }
        .card.playing.rarity-Legendary, .mini-card.playing.rarity-Legendary, .list-card.playing.rarity-Legendary, .tourn-card.playing.rarity-Legendary { 
            box-shadow: 0 8px 38px rgba(234, 179, 8, 1), 0 0 24px var(--rarity-legend); 
        }
        .tourn-card.blind-card.playing {
            border-color: #ffffff;
            box-shadow: 0 8px 30px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 1);
        }

        .card-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            width: 100%;
            height: 28px;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }

        .lvl-badge {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid currentColor;
            font-size: 0.6rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 6px;
            line-height: 1;
            white-space: nowrap;
            transition: all 0.3s;
            flex-shrink: 0;
            z-index: 2;
            user-select: none;
            -webkit-user-select: none;
        }

        .copies-tag {
            font-size: 0.62rem;
            color: #888;
            margin-top: 1px;
            white-space: nowrap;
        }
        
        .lvl-color-1 { color: var(--lvl-1-color); }
        .lvl-color-2 { color: var(--lvl-2-color); text-shadow: 0 0 5px rgba(74,222,128,0.4); }
        .lvl-color-3 { color: var(--lvl-3-color); text-shadow: 0 0 5px rgba(96,165,250,0.4); }
        .lvl-color-4 { color: var(--lvl-4-color); text-shadow: 0 0 5px rgba(192,132,252,0.4); }
        .lvl-color-5 { color: var(--lvl-5-color); text-shadow: 0 0 5px rgba(250,204,21,0.4); }

        .rarity-badge {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            padding: 2px 8px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.6rem;
            text-transform: uppercase;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 1;
            user-select: none;
            -webkit-user-select: none;
        }

        @container (max-width: 150px) {
            .rarity-badge { display: none !important; }
        }

        .rarity-Common .rarity-badge { background: var(--rarity-common); color: #000; }
        .rarity-Rare .rarity-badge { background: var(--rarity-rare); color: #fff; }
        .rarity-Epic .rarity-badge { background: var(--rarity-epic); color: #fff; }
        .rarity-Legendary .rarity-badge { background: var(--rarity-legend); color: #000; }

        .fav-btn, .shuffle-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #444;
            color: #aaa;
            font-size: 0.85rem;
            width: 28px !important;
            height: 28px !important;
            min-width: 28px !important;
            min-height: 28px !important;
            max-width: 28px !important;
            max-height: 28px !important;
            border-radius: 50% !important;
            cursor: pointer;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            transition: color 0.2s, transform 0.1s, background 0.2s;
            padding: 0 !important;
            line-height: 1 !important;
            flex-shrink: 0 !important;
            box-sizing: border-box !important;
            overflow: hidden !important;
            z-index: 2;
        }

        .shuffle-btn svg { 
            width: 14px !important; 
            height: 14px !important; 
            fill: #aaa; 
            transition: fill 0.2s; 
            display: block;
        }

        .fav-btn.active { color: #eab308; border-color: #eab308; text-shadow: 0 0 5px rgba(234, 179, 8, 0.8); }
        .shuffle-btn:hover svg { fill: #fff; }
        .shuffle-btn:hover, .fav-btn:hover { transform: scale(1.1); background: rgba(0, 0, 0, 0.9); }

        .cover-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            margin-bottom: 6px;
            border-radius: 6px;
            overflow: hidden;
            background: #18181c;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .cover-art { width: 100%; height: 100%; object-fit: cover; display: block; }

        .vinyl-placeholder {
            width: 100%; height: 100%; background: radial-gradient(circle, #2a2a35 0%, #111115 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; box-sizing: border-box; border: 1px solid #333;
        }
        .vinyl-placeholder .ph-title { font-size: 0.75rem; font-weight: bold; color: #fff; margin-bottom: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .vinyl-placeholder .ph-artist { font-size: 0.65rem; color: #888; }

        .blind-cover-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: rgba(255, 255, 255, 0.8);
            box-sizing: border-box;
            user-select: none;
        }

        .play-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4);
            display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s ease;
            pointer-events: none;
        }

        @media (hover: hover) {
            .play-overlay { opacity: 0 !important; }
            .cover-wrapper:hover .play-overlay, 
            .mini-cover-wrapper:hover .play-overlay, 
            .list-cover-wrapper:hover .play-overlay { 
                opacity: 1 !important; 
            }
        }

        @media (hover: none) {
            .play-overlay {
                display: none !important;
                opacity: 0 !important;
            }
        }

        .play-btn-icon {
            width: 34px; height: 34px; background: rgba(255, 255, 255, 0.95); color: #000; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5); transition: transform 0.15s ease; box-sizing: border-box;
        }

        .play-btn-icon svg { width: 14px; height: 14px; fill: #000; }

        .progress-bar-container { 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            height: 3px; 
            background: rgba(255, 255, 255, 0.2); 
            z-index: 4; 
            display: none; 
        }

        .playing .progress-bar-container { display: block !important; }
        .progress-bar-fill { height: 100%; width: 0%; background: var(--rarity-common); transition: width 0.1s linear; }

        .rarity-Common .progress-bar-fill { background: var(--rarity-common); }
        .rarity-Rare .progress-bar-fill { background: var(--rarity-rare); }
        .rarity-Epic .progress-bar-fill { background: var(--rarity-epic); }
        .rarity-Legendary .progress-bar-fill { background: var(--rarity-legend); }
        .tourn-card.blind-card .progress-bar-fill { background: #ffffff !important; }

        .card-details-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 2px;
            width: 100%;
            min-height: 110px;
            box-sizing: border-box;
            margin-top: 2px;
            padding: 2px 0;
            overflow: hidden;
            flex: 1;
        }

        .mini-track-container {
            min-height: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            overflow: hidden;
        }

        .track-preview-name {
            color: var(--accent-color);
            font-size: 0.65rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .album-title { 
            font-size: 0.8rem; 
            font-weight: bold; 
            margin: 1px 0; 
            line-height: 1.15;
            width: 100%; 
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .artist-name { 
            color: #aaa; 
            font-size: 0.7rem; 
            margin: 0; 
            line-height: 1.15;
            width: 100%; 
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .type-badge { 
            display: inline-block; 
            align-self: center; 
            background: #2a2a32; 
            color: var(--accent-color); 
            padding: 1px 5px; 
            border-radius: 4px; 
            font-size: 0.58rem; 
            font-weight: bold; 
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        .score-badge { color: #eab308; font-weight: bold; font-size: 0.72rem; margin: 1px 0; }
        
        .genre-badge { 
            color: #888; 
            font-size: 0.62rem; 
            margin: 0; 
            font-style: italic; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .collection-section { 
            width: 100%; 
            max-width: 1300px; 
            margin-top: 20px; 
            border-top: 1px solid #282832;
            padding-top: 15px;
        }
        
        .collection-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
        .filter-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        .collection-stats-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #1e1e24;
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid #333;
            font-size: 0.75rem;
            color: #bbb;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .stat-badge {
            background: rgba(255,255,255,0.05);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            color: #fff;
        }

        select, button.view-btn, button.toggle-col-btn { background: #1e1e24; color: #fff; border: 1px solid #333; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.75rem; }
        button.view-btn.active { background: var(--accent-color); border-color: var(--accent-color); }
        button.toggle-col-btn { background: #2a2a35; font-weight: bold; border-color: var(--accent-color); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }

        .mini-card {
            background: var(--card-bg); border-radius: 8px; padding: 8px; text-align: center; font-size: 0.75rem; transition: transform 0.2s, box-shadow 0.2s; position: relative; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; border-width: 2px; border-style: solid;
        }

        .mini-card:hover { transform: translateY(-3px); }
        .mini-cover-wrapper { position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 5px; overflow: hidden; background: #18181c; margin-bottom: 4px; }
        .mini-cover-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .artist-group { background: #18181c; border-radius: 10px; padding: 12px; margin-bottom: 15px; border: 1px solid #2e2e38; }
        .artist-group-header { font-size: 1rem; font-weight: bold; color: #a855f7; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #2e2e38; padding-bottom: 4px; }

        .list { display: flex; flex-direction: column; gap: 6px; }
        .list-card { 
            background: var(--card-bg); border-radius: 6px; padding: 6px 10px; display: flex; align-items: center; 
            justify-content: space-between; gap: 10px; border-left-width: 4px; border-left-style: solid; transition: background 0.2s; 
            position: relative; cursor: pointer; box-sizing: border-box; width: 100%;
        }
        .list-card.playing { background: #282832; }
        .list-cover-wrapper { position: relative; width: 40px; height: 40px; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
        .list-cover-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .list-card .list-main { flex: 1; min-width: 0; overflow: hidden; display: flex; flex-direction: column; gap: 1px; }
        .list-card .list-title { font-weight: bold; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .list-card .list-artist { color: #aaa; font-size: 0.7rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .list-card .list-right-group { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .list-card .list-meta { color: #777; font-size: 0.65rem; text-align: right; display: flex; flex-direction: column; gap: 1px; align-items: flex-end; white-space: nowrap; }

        .tournament-setup {
            background: #1e1e24;
            border-radius: 12px;
            padding: 16px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
            border: 1px solid #2e2e38;
        }

        .setup-group { display: flex; flex-direction: column; gap: 4px; text-align: left; }
        .setup-group label { font-size: 0.78rem; color: #aaa; font-weight: bold; }
        .setup-group select { padding: 6px; font-size: 0.85rem; background: #121214; border-color: #3e3e4a; }

        .battle-arena {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .tournament-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            background: #1e1e24;
            padding: 4px 10px;
            border-radius: 6px;
            box-sizing: border-box;
            border: 1px solid #333;
            font-size: 0.75rem;
        }

        .match-cards-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
            align-items: stretch;
        }

        .tourn-card {
            flex: 1;
            max-width: 230px;
            min-width: 0;
            background: var(--card-bg);
            border-radius: 8px;
            padding: 6px;

    <script>
        const RARITY_MAP = {
            'Легендарная': 'Legendary',
            'Эпическая': 'Epic',
            'Редкая': 'Rare',
            'Обычная': 'Common'
        };

        const RARITY_ORDER = { 'Legendary': 4, 'Epic': 3, 'Rare': 2, 'Common': 1 };
        const DROP_RATES = { 'Legendary': 3, 'Epic': 12, 'Rare': 30, 'Common': 55 };
        const SHUFFLE_SVG = `<svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>`;

        let allAlbums = [];
        let collection = new Map();
        let collectionTracksCache = new Map();
        let currentViewMode = 'grid';
        let isCollectionExpanded = false;
        let isFirstPackOpened = false;

        let currentAudio = null;
        let currentPlayingSlot = null;
        let currentPlayingId = null; 
        let loadingCollectionId = null;
        let currentPackData = [];
        let nextPackCache = null;

        let tournBracket = [];
        let tournNextRound = [];
        let currentMatchAlbums = [];
        let currentMatchVotes = [];
        let matchSize = 2;
        let isBlindMode = false;
        let revealedSlots = []; 
        let currentRoundNumber = 1;
        let currentMatchNumber = 1;
        let championAlbumObj = null;

        let tournamentEliminationLog = []; 
        let totalTournParticipants = 0;

        let touchStartX = 0;
        let touchStartY = 0;

        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function calculateLevel(pulls) {
            if (pulls >= 81) return 5;
            if (pulls >= 27) return 4;
            if (pulls >= 9) return 3;
            if (pulls >= 3) return 2;
            return 1;
        }

        function getCopiesProgressText(pulls) {
            if (pulls >= 81) return 'MAX';
            if (pulls >= 27) return `${pulls}/81`;
            if (pulls >= 9) return `${pulls}/27`;
            if (pulls >= 3) return `${pulls}/3`;
            return `${pulls}/3`;
        }

        function getLevelColorClass(level) { return `lvl-color-${Math.min(level, 5)}`; }

        function saveProgress() {
            try {
                const serializableCol = Array.from(collection.entries()).map(([id, item]) => {
                    const cleanItem = { ...item };
                    delete cleanItem.preview;
                    delete cleanItem.trackName;
                    delete cleanItem.isLevelUp;
                    return [id, cleanItem];
                });
                localStorage.setItem('album_gacha_collection', JSON.stringify(serializableCol));
            } catch (e) { console.error('Failed to save collection:', e); }
        }

        function loadProgress() {
            try {
                const savedCol = localStorage.getItem('album_gacha_collection');
                if (savedCol) { collection = new Map(JSON.parse(savedCol)); }
            } catch (e) { console.error('Failed to load collection:', e); }
        }

        function clearSaveData() {
            if (confirm('Are you sure you want to clear your collection and restart?')) {
                localStorage.removeItem('album_gacha_collection');
                collection.clear();
                collectionTracksCache.clear();
                renderCollectionUI();
                updateTournamentSourceDropdown();
            }
        }

        function updateTournamentSourceDropdown() {
            const select = document.getElementById('tournSource');
            if (!select) return;

            const totalAll = allAlbums.length;
            const totalCol = collection.size;
            let totalFav = 0;

            collection.forEach(item => {
                if (item.isFavorite) totalFav++;
            });

            select.options[0].text = `All Albums (${totalAll})`;
            select.options[1].text = `My Collection Only (${totalCol})`;
            select.options[2].text = `Favorites Only (${totalFav})`;
        }

        async function loadDatabase() {
            try {
                const res = await fetch('albums.json');
                const rawData = await res.json();
                allAlbums = rawData.map(item => ({
                    ...item,
                    rarity: RARITY_MAP[item.rarity] || item.rarity || 'Common'
                }));
                loadProgress();
                renderCollectionUI();
                updateTournamentSourceDropdown();
                
                document.getElementById('pullBtn').disabled = false;
                document.getElementById('pullBtnBottom').disabled = false;
                document.getElementById('btnInitialPull').disabled = false;
                
                initSwipeListeners();
            } catch (err) {
                alert('Error loading albums.json!');
                console.error(err);
            }
        }

        function initSwipeListeners() {
            const packContainer = document.getElementById('packContainer');
            const matchContainer = document.getElementById('matchCardsContainer');

            [packContainer, matchContainer].forEach(container => {
                if (!container) return;
                container.addEventListener('touchstart', e => {
                    touchStartX = e.changedTouches[0].clientX;
                    touchStartY = e.changedTouches[0].clientY;
                }, { passive: true });

                container.addEventListener('touchmove', e => {
                    const currentX = e.changedTouches[0].clientX;
                    const currentY = e.changedTouches[0].clientY;
                    const diffX = Math.abs(currentX - touchStartX);
                    const diffY = Math.abs(currentY - touchStartY);

                    if (diffX > diffY && diffX > 10) {
                        if (e.cancelable) e.preventDefault();
                    }
                }, { passive: false });

                container.addEventListener('touchend', e => {
                    const touchEndX = e.changedTouches[0].clientX;
                    const touchEndY = e.changedTouches[0].clientY;
                    handleSwipeGesture(container, touchStartX, touchEndX, touchStartY, touchEndY);
                }, { passive: true });
            });
        }

        function getNextAvailableSlot(list, currentSlot, direction) {
            if (!list || list.length === 0) return 0;
            const len = list.length;
            let checkSlot = currentSlot;
            for (let i = 0; i < len; i++) {
                checkSlot = (checkSlot + direction + len) % len;
                if (list[checkSlot] && list[checkSlot].preview) {
                    return checkSlot;
                }
            }
            return currentSlot;
        }

        function handleSwipeGesture(container, startX, endX, startY, endY) {
            const diffX = endX - startX;
            const diffY = endY - startY;

            if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY) * 1.2) {
                if (container.id === 'packContainer' && currentPackData.length > 0) {
                    let currentSlot = currentPlayingSlot !== null ? currentPlayingSlot : 0;
                    const dir = (diffX < 0) ? 1 : -1;
                    const targetSlot = getNextAvailableSlot(currentPackData, currentSlot, dir);
                    playSlot(targetSlot);
                } else if (container.id === 'matchCardsContainer' && currentMatchAlbums.length > 0) {
                    let currentSlot = currentPlayingSlot !== null ? currentPlayingSlot : 0;
                    const dir = (diffX < 0) ? 1 : -1;
                    const targetSlot = getNextAvailableSlot(currentMatchAlbums, currentSlot, dir);
                    playTournamentCarouselTrack(targetSlot);
                }
            }
        }

        function switchMode(mode) {
            stopCurrentAudio();
            document.getElementById('tabGacha').classList.toggle('active', mode === 'gacha');
            document.getElementById('tabTournament').classList.toggle('active', mode === 'tournament');
            document.getElementById('gachaSection').classList.toggle('hidden', mode !== 'gacha');
            document.getElementById('tournamentSection').classList.toggle('hidden', mode !== 'tournament');
            if (mode === 'tournament') {
                updateTournamentSourceDropdown();
            }
        }

        function toggleCollectionArea() {
            isCollectionExpanded = !isCollectionExpanded;
            const packArea = document.getElementById('packArea');
            const colContainer = document.getElementById('collectionContainer');
            const colControls = document.getElementById('collectionControls');
            const colStats = document.getElementById('collectionStatsBar');
            const btn = document.getElementById('btnToggleCollection');

            if (isCollectionExpanded) {
                packArea.classList.add('hidden');
                colContainer.classList.remove('hidden');
                colControls.classList.remove('hidden');
                colStats.classList.remove('hidden');
                btn.innerText = '🙈 Hide Collection Area';
            } else {
                packArea.classList.remove('hidden');
                colContainer.classList.add('hidden');
                colControls.classList.add('hidden');
                colStats.classList.add('hidden');
                btn.innerText = '📦 Show Collection';
            }
            renderCollectionUI();
        }

        function rollRarity() {
            const rand = Math.random() * 100;
            if (rand < DROP_RATES['Legendary']) return 'Legendary';
            if (rand < DROP_RATES['Legendary'] + DROP_RATES['Epic']) return 'Epic';
            if (rand < DROP_RATES['Legendary'] + DROP_RATES['Epic'] + DROP_RATES['Rare']) return 'Rare';
            return 'Common';
        }

        function getRandomAlbumByRarity(targetRarity) {
            const pool = allAlbums.filter(a => a.rarity === targetRarity);
            return pool.length > 0 ? pool[Math.floor(Math.random() * pool.length)] : allAlbums[Math.floor(Math.random() * allAlbums.length)];
        }

        function createInitialPackSkeletons() {
            stopCurrentAudio();
            currentPackData = [];
            const packContainer = document.getElementById('packContainer');
            packContainer.className = 'pack-container';
            packContainer.innerHTML = '';

            for (let i = 0; i < 5; i++) {
                const card = document.createElement('div');
                card.id = `pack-card-${i}`;
                card.className = 'card skeleton';
                card.innerHTML = `
                    <div>
                        <div class="card-top-bar">
                            <div class="lvl-badge">LVL ?</div>
                            <div class="rarity-badge">???</div>
                            <div style="display:flex; gap:4px; align-items:center;">
                                <div class="shuffle-btn"></div>
                                <div class="fav-btn">★</div>
                            </div>
                        </div>
                        <div class="cover-wrapper"></div>
                        <div class="card-details-box">
                            <div class="mini-track-container"><div class="track-preview-name">...</div></div>
                            <div class="artist-name">...</div>
                            <div class="album-title">Opening...</div>
                            <div class="type-badge">...</div>
                            <div class="score-badge">★ -.-</div>
                            <div class="copies-tag">🃏 ...</div>
                            <div class="genre-badge">🏷️ ...</div>
                        </div>
                    </div>
                `;
                packContainer.appendChild(card);
            }
        }

        async function fetchPackData() {
            const fetchedPack = [];
            for (let i = 0; i < 5; i++) {
                const targetRarity = rollRarity();
                const rawAlbum = getRandomAlbumByRarity(targetRarity);
                const albumObj = await fetchHitTrackForAlbum(rawAlbum, false, false);
                fetchedPack.push(albumObj);
            }
            return fetchedPack;
        }

        async function pull5Pack() {
            if (allAlbums.length === 0) return;

            if (!isFirstPackOpened) {
                isFirstPackOpened = true;
                document.getElementById('initialStartBox').classList.add('hidden');
                document.getElementById('topControls').classList.remove('hidden');
                document.getElementById('packContainer').classList.remove('hidden');
                document.getElementById('bottomControls').classList.remove('hidden');
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });

            const btnTop = document.getElementById('pullBtn');
            const btnBottom = document.getElementById('pullBtnBottom');
            btnTop.disabled = true;
            btnBottom.disabled = true;

            let fetchedPack = [];

            if (nextPackCache && nextPackCache.length === 5) {
                fetchedPack = nextPackCache;
                nextPackCache = null;
            } else {
                createInitialPackSkeletons();
                fetchedPack = await fetchPackData();
            }

            currentPackData = fetchedPack;

            for (let i = 0; i < 5; i++) {
                const albumObj = currentPackData[i];
                revealCardInPack(albumObj, i);
                addToCollectionDataOnly(albumObj);
                await sleep(10);
            }

            fetchPackData().then(p => { nextPackCache = p; });

            saveProgress();
            renderCollectionUI();
            updateTournamentSourceDropdown();
            btnTop.disabled = false;
            btnBottom.disabled = false;
            playSlot(0);
        }

        function normalizeStr(str) {
            if (!str) return '';
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/gi, '').trim();
        }
        
        function cleanQueryString(str) {
            if (!str) return '';
            return str.replace(/\[.*?\]/g, '').replace(/\(.*?\)/g, '').replace(/[-_]/g, ' ').trim();
        }

        function jsonpFetch(url) {
            return new Promise((resolve) => {
                const script = document.createElement('script');
                const callbackName = `jsonpCb_${Date.now()}_${Math.floor(Math.random() * 100000)}`;

                window[callbackName] = function(data) {
                    delete window[callbackName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    resolve(data);
                };
                script.onerror = function() {
                    delete window[callbackName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    resolve(null);
                };

                const joinChar = url.includes('?') ? '&' : '?';
                script.src = `${url}${joinChar}callback=${callbackName}`;
                document.body.appendChild(script);
            });
        }

        async function verifyAudioUrl(url) {
            if (!url) return false;
            return new Promise((resolve) => {
                const audio = new Audio();
                const timer = setTimeout(() => { audio.src = ''; resolve(false); }, 2500);
                audio.oncanplaythrough = () => { clearTimeout(timer); audio.src = ''; resolve(true); };
                audio.onerror = () => { clearTimeout(timer); audio.src = ''; resolve(false); };
                audio.src = url;
            });
        }

        async function fetchHitTrackForAlbum(albumData, forceRandom = false, preserveLevel = false) {
            const cleanArtist = cleanQueryString(albumData.artist);
            const cleanTitle = cleanQueryString(albumData.title);
            const targetNormArtist = normalizeStr(cleanArtist);

            const isStrictMatch = (fetchedArtist) => {
                const fetchedNorm = normalizeStr(fetchedArtist);
                return fetchedNorm === targetNormArtist || fetchedNorm.includes(targetNormArtist) || targetNormArtist.includes(fetchedNorm);
            };

            const existingEntry = collection.get(albumData.id);
            const oldPulls = existingEntry ? existingEntry.pulls : 0;
            const newPulls = preserveLevel ? (albumData.pulls || oldPulls || 1) : oldPulls + 1;
            
            const oldLevel = calculateLevel(oldPulls);
            const newLevel = calculateLevel(newPulls);
            const isLevelUp = !preserveLevel && (newLevel > oldLevel) && (oldPulls > 0);
                
            let coverUrl = existingEntry ? existingEntry.cover : (albumData.cover || '');
            let hitTrack = null;

            try {
                const dzData = await jsonpFetch(`https://api.deezer.com/search/album?q=${encodeURIComponent(`${cleanArtist} ${cleanTitle}`)}&limit=5&output=jsonp`);
                if (dzData && dzData.data && dzData.data.length > 0) {
                    let match = dzData.data.find(a => isStrictMatch(a.artist.name));
                    if (!match) match = dzData.data[0];

                    if (!coverUrl && match.cover_xl) coverUrl = match.cover_xl || match.cover_big;
                    if (match.id) {
                        const tracksData = await jsonpFetch(`https://api.deezer.com/album/${match.id}/tracks?output=jsonp`);
                        if (tracksData && tracksData.data && tracksData.data.length > 0) {
                            let validTracks = tracksData.data.filter(s => s.preview);
                            
                            if (validTracks.length > 1) {
                                validTracks = validTracks.filter((t, index) => index > 0 && t.track_position !== 1);
                            }

                            if (validTracks.length > 0) {
                                if (forceRandom && albumData.trackName && validTracks.length > 1) {
                                    validTracks = validTracks.filter(t => t.title !== albumData.trackName);
                                }
                                if (forceRandom) validTracks.sort(() => Math.random() - 0.5);

                                for (const selected of validTracks) {
                                    const isOk = await verifyAudioUrl(selected.preview);
                                    if (isOk) {
                                        hitTrack = { name: selected.title, preview: selected.preview };
                                        break;
                                    }
                                }
                            }
                        }
                    }
                }
            } catch (e) { console.log('Deezer fetch err'); }

            if (!hitTrack) {
                try {
                    const itunesData = await jsonpFetch(`https://itunes.apple.com/search?term=${encodeURIComponent(`${cleanArtist} ${cleanTitle}`)}&entity=song&limit=20`);
                    if (itunesData && itunesData.results && itunesData.results.length > 0) {
                        let validSongs = itunesData.results.filter(s => s.previewUrl && isStrictMatch(s.artistName));
                        
                        if (validSongs.length > 1) {
                            validSongs = validSongs.filter(s => s.trackNumber !== 1);
                        }

                        if (validSongs.length > 0) {
                            if (forceRandom && albumData.trackName && validSongs.length > 1) {
                                validSongs = validSongs.filter(s => s.trackName !== albumData.trackName);
                            }
                            if (forceRandom) validSongs.sort(() => Math.random() - 0.5);

                            for (const selected of validSongs) {
                                if (!coverUrl && selected.artworkUrl100) coverUrl = selected.artworkUrl100.replace('100x100bb', '600x600bb');
                                const isOk = await verifyAudioUrl(selected.previewUrl);
                                if (isOk) {
                                    hitTrack = { name: selected.trackName, preview: selected.previewUrl };
                                    break;
                                }
                            }
                        }
                    }
                } catch (e) { console.log('iTunes fetch err'); }
            }

            const isFav = existingEntry ? Boolean(existingEntry.isFavorite) : Boolean(albumData.isFavorite);

            return {
                ...albumData,
                pulls: newPulls,
                level: newLevel,
                isLevelUp: isLevelUp,
                isFavorite: isFav,
                cover: coverUrl,
                preview: hitTrack ? hitTrack.preview : '',
                trackName: hitTrack ? hitTrack.name : '',
                pulledAt: albumData.pulledAt || (Date.now() + Math.random())
            };
        }

        function togglePlaySlot(slotIndex) {
            if (currentPlayingSlot === slotIndex && currentAudio && !currentAudio.paused) pauseCurrentAudio();
            else playSlot(slotIndex);
        }

        async function fadeInAudio(audioObj, targetVolume = 1.0, duration = 500) {
            if (!audioObj) return;
            audioObj.volume = 0.0;
            const steps = 20;
            const stepTime = duration / steps;
            const volumeIncrement = targetVolume / steps;

            for (let i = 0; i < steps; i++) {
                if (!currentAudio || currentAudio !== audioObj) break;
                audioObj.volume = Math.min(targetVolume, audioObj.volume + volumeIncrement);
                await sleep(stepTime);
            }
        }

        async function playSlot(slotIndex) {
            await fadeAndStopAudio();
            const albumData = currentPackData[slotIndex];
            if (!albumData || !albumData.preview) { playNextSlotInCarousel(slotIndex); return; }

            currentPlayingSlot = slotIndex;
            currentPlayingId = `pack_${albumData.id}`;

            const card = document.getElementById(`pack-card-${slotIndex}`);
            const icon = document.getElementById(`play-icon-${slotIndex}`);
            const progressBar = document.getElementById(`progress-${slotIndex}`);

            if (card) {
                card.classList.add('playing');
                if (window.innerWidth <= 600) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
            if (icon) icon.innerHTML = '<svg viewBox="0 0 24 24" style="padding-right:0;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

            currentAudio = new Audio(albumData.preview);
            
            let fadeOutTriggered = false;
            currentAudio.ontimeupdate = () => {
                if (currentAudio && currentAudio.duration) {
                    if (progressBar) progressBar.style.width = `${(currentAudio.currentTime / currentAudio.duration) * 100}%`;
                    
                    if (currentAudio.duration - currentAudio.currentTime <= 0.8 && !fadeOutTriggered) {
                        fadeOutTriggered = true;
                        let vol = currentAudio.volume;
                        const fadeInterval = setInterval(() => {
                            if (currentAudio && currentAudio.volume > 0.05) {
                                currentAudio.volume = Math.max(0, currentAudio.volume - 0.1);
                            } else {
                                clearInterval(fadeInterval);
                            }
                        }, 40);
                    }
                }
            };
            
            currentAudio.onended = async () => {
                await sleep(600);
                resetSlotUI(slotIndex);
                const nextSlot = (slotIndex + 1) % 5;
                const isAutoPullEnabled = document.getElementById('autoPullCheck') ? document.getElementById('autoPullCheck').checked : false;

                if (nextSlot === 0 && isAutoPullEnabled) {
                    pull5Pack();
                } else {
                    if (nextSlot === 0) {
                        for (let i = 0; i < 5; i++) {
                            if (currentPackData[i]) {
                                currentPackData[i] = await fetchHitTrackForAlbum(currentPackData[i], true, true);
                                revealCardInPack(currentPackData[i], i);
                            }
                        }
                    }
                    playSlot(nextSlot);
                }
            };

            currentAudio.play().then(() => {
                fadeInAudio(currentAudio, 1.0, 500);
            }).catch(e => { resetSlotUI(slotIndex); playNextSlotInCarousel(slotIndex); });
            renderCollectionUI();
        }

        function playNextSlotInCarousel(fromSlotIndex) {
            if (currentPackData.length === 0) return;
            const nextSlot = getNextAvailableSlot(currentPackData, fromSlotIndex, 1);
            if (nextSlot !== fromSlotIndex) playSlot(nextSlot);
        }

        async function playCollectionAlbum(albumId, forceNextTrack = false, event = null) {
            if (event) event.stopPropagation();
            const trackKey = `col_${albumId}`;

            if (!forceNextTrack && currentPlayingId === trackKey && currentAudio && !currentAudio.paused) {
                pauseCurrentAudio(); renderCollectionUI(); return;
            }
            await fadeAndStopAudio();

            const album = collection.get(albumId);
            if (!album) return;

            loadingCollectionId = albumId; renderCollectionUI();
            const refreshedData = await fetchHitTrackForAlbum(album, forceNextTrack, true);
            loadingCollectionId = null;

            if (refreshedData && refreshedData.preview) {
                collectionTracksCache.set(albumId, refreshedData.trackName || 'Preview Track');
                currentPlayingId = trackKey;
                currentAudio = new Audio(refreshedData.preview);

                let fadeOutTriggered = false;
                currentAudio.ontimeupdate = () => {
                    if (currentAudio && currentAudio.duration) {
                        const progressBar = document.getElementById(`col-progress-${albumId}`);
                        if (progressBar) progressBar.style.width = `${(currentAudio.currentTime / currentAudio.duration) * 100}%`;

                        if (currentAudio.duration - currentAudio.currentTime <= 0.8 && !fadeOutTriggered) {
                            fadeOutTriggered = true;
                            let vol = currentAudio.volume;
                            const fadeInterval = setInterval(() => {
                                if (currentAudio && currentAudio.volume > 0.05) {
                                    currentAudio.volume = Math.max(0, currentAudio.volume - 0.1);
                                } else {
                                    clearInterval(fadeInterval);
                                }
                            }, 40);
                        }
                    }
                };
                currentAudio.onended = async () => { 
                    await sleep(600);
                    currentPlayingId = null; 
                    renderCollectionUI(); 
                };
                currentAudio.play().then(() => {
                    fadeInAudio(currentAudio, 1.0, 500);
                }).catch(e => { currentPlayingId = null; renderCollectionUI(); });
            } else { alert('Audio preview not available right now.'); }
            renderCollectionUI();
        }

        async function fadeAndStopAudio() {
            if (currentAudio) {
                const aud = currentAudio;
                currentAudio = null;
                aud.onended = null;
                aud.onerror = null;
                
                try {
                    let vol = aud.volume;
                    const steps = 15;
                    const volStep = vol / steps;
                    for (let i = 0; i < steps; i++) {
                        vol = Math.max(0, vol - volStep);
                        aud.volume = vol;
                        await sleep(20);
                    }
                    aud.pause();
                } catch(e) {
                    aud.pause();
                }
            }
            if (currentPlayingSlot !== null) { 
                resetSlotUI(currentPlayingSlot); 
                resetTournamentSlotUI(currentPlayingSlot);
                currentPlayingSlot = null; 
            }
            currentPlayingId = null;
            loadingCollectionId = null;
        }

        function pauseCurrentAudio() {
            fadeAndStopAudio();
        }

        function stopCurrentAudio() {
            fadeAndStopAudio();
        }

        function renderCollectionUI() {
            renderCollectionStats();

            const container = document.getElementById('collectionContainer');
            if (!isCollectionExpanded) {
                container.innerHTML = '';
                return;
            }

            const fragment = document.createDocumentFragment();
            let albumsArray = Array.from(collection.values());
            albumsArray.forEach(item => { if (!item.level) item.level = calculateLevel(item.pulls || 1); });

            const sortMode = document.getElementById('sortSelect').value;
            const sortWithFavs = (sortFn) => {
                albumsArray.sort((a, b) => {
                    if (a.isFavorite && !b.isFavorite) return -1;
                    if (!a.isFavorite && b.isFavorite) return 1;
                    return sortFn(a, b);
                });
            };

            if (sortMode === 'pulls_desc') sortWithFavs((a, b) => b.level - a.level || b.pulls - a.pulls);
            else if (sortMode === 'copies_desc') sortWithFavs((a, b) => (b.pulls || 1) - (a.pulls || 1));
            else if (sortMode === 'rarity') sortWithFavs((a, b) => RARITY_ORDER[b.rarity] - RARITY_ORDER[a.rarity]);
            else if (sortMode === 'score') sortWithFavs((a, b) => parseFloat(b.score) - parseFloat(a.score));
            else if (sortMode === 'genre') sortWithFavs((a, b) => a.genre.localeCompare(b.genre));
            else if (sortMode === 'year') sortWithFavs((a, b) => (b.year === 'N/A' ? 0 : b.year) - (a.year === 'N/A' ? 0 : a.year));
            else sortWithFavs((a, b) => b.pulledAt - a.pulledAt);

            if (currentViewMode === 'artist') {
                container.className = 'grid'; renderArtistGroupView(fragment, albumsArray);
            } else {
                container.className = currentViewMode;
                albumsArray.forEach(item => fragment.appendChild(createAlbumCardElement(item, currentViewMode)));

            container.innerHTML = '';

        }

        function getPlayoffStageTitle(remainingCount) {
            if (remainingCount <= 2) return "🏆 FINAL";
            if (remainingCount <= 4) return "🔥 Semi-Finals";
            if (remainingCount <= 8) return "⚡ Quarter-Finals";
            if (remainingCount <= 16) return "🥊 Round of 16";
            if (remainingCount <= 32) return "🎯 Round of 32";
            if (remainingCount <= 64) return "🎲 Round of 64";
            if (remainingCount <= 128) return "🎮 Round of 128";
            return `⚔️ Round of ${Math.pow(2, Math.ceil(Math.log2(remainingCount)))}`;

        async function startTournament() {
            const source = document.getElementById('tournSource').value;
            const targetSize = parseInt(document.getElementById('tournSize').value, 10);
            const format = document.getElementById('tournFormat').value;
            isBlindMode = document.getElementById('tournBlindCheck').checked;

            const btn = document.getElementById('btnStartTourn');
            const progressOverlay = document.getElementById('tournProgressOverlay');
            const progressFill = document.getElementById('tournProgressFill');
            const progressText = document.getElementById('tournProgressText');

            matchSize = (format === '4way') ? 4 : 2;

            let pool = [];
            if (source === 'collection') pool = Array.from(collection.values());
            else if (source === 'favorites') pool = Array.from(collection.values()).filter(a => a.isFavorite);
            else pool = [...allAlbums];

            if (pool.length < targetSize) {
                alert(`Not enough albums in selected pool (${pool.length} available). Please select at least ${targetSize} albums or reduce bracket size!`);
                return;
            }

            document.getElementById('winnerScreen').classList.add('hidden');
            document.getElementById('tournamentSetup').classList.remove('hidden');

            btn.disabled = true;
            progressOverlay.classList.remove('hidden');
            progressFill.style.width = '0%';
            progressText.innerText = `Preparing audio tracks... (0 / ${targetSize})`;

            pool.sort(() => Math.random() - 0.5);

            const validBracket = [];
            const chunkSize = 4;

            for (let i = 0; i < pool.length; i += chunkSize) {
                if (validBracket.length >= targetSize) break;

                const chunk = pool.slice(i, i + chunkSize);
                const results = await Promise.all(chunk.map(album => fetchHitTrackForAlbum(album, false, true)));

                for (const fullObj of results) {
                    if (fullObj && fullObj.preview && validBracket.length < targetSize) {
                        validBracket.push(fullObj);
                    }
                }

                const currentPercent = Math.min(100, Math.round((validBracket.length / targetSize) * 100));
                progressFill.style.width = `${currentPercent}%`;
                progressText.innerText = `Loading participants: ${validBracket.length} of ${targetSize} (${currentPercent}%)`;

                await new Promise(r => requestAnimationFrame(r));
            }

            progressOverlay.classList.add('hidden');

            if (validBracket.length < matchSize) {
                alert('Could not load enough valid audio preview tracks.');
                btn.disabled = false;
                return;
            }

            tournBracket = validBracket;
            tournNextRound = [];
            tournamentEliminationLog = [];
            totalTournParticipants = validBracket.length;

            currentRoundNumber = 1;
            currentMatchNumber = 1;

            btn.disabled = false;

            document.getElementById('tournamentSetup').classList.add('hidden');
            document.getElementById('winnerScreen').classList.add('hidden');
            document.getElementById('battleArena').classList.remove('hidden');

            loadNextMatch();
        }

        async function loadNextMatch() {
            stopCurrentAudio();
            revealedSlots = []; 
            document.getElementById('btnRollDice').disabled = false;

            if (tournBracket.length === 1 && tournNextRound.length === 0) {
                showChampionScreen(tournBracket[0]);
                return;
            }

            if (tournBracket.length < matchSize) {
                if (tournBracket.length > 0) tournNextRound.push(...tournBracket);
                
                if (tournNextRound.length === 1) {
                    showChampionScreen(tournNextRound[0]);
                    return;
                }

                tournBracket = [...tournNextRound];
                tournNextRound = [];
                tournBracket.sort(() => Math.random() - 0.5);
                currentRoundNumber++;
                currentMatchNumber = 1;
            }

            currentMatchAlbums = [];
            currentMatchVotes = [];

            for (let i = 0; i < matchSize; i++) {
                if (tournBracket.length > 0) {
                    const participant = tournBracket.shift();
                    currentMatchAlbums.push(participant);
                    currentMatchVotes.push(0);
                    addToCollectionDataOnly(participant);
                }
            }

            saveProgress();
            renderCollectionUI();
            updateTournamentSourceDropdown();

            renderBattleMatchUI();
            playTournamentCarouselTrack(0);

        async function playTournamentCarouselTrack(idx) {
            await fadeAndStopAudio();
            const album = currentMatchAlbums[idx];
            if (!album || !album.preview) {
                playNextMatchTrackInCarousel(idx);
                return;
            }

            currentPlayingSlot = idx;
            currentPlayingId = `tourn_${idx}`;

            highlightTournamentCard(idx);

            const newAudio = new Audio(album.preview);
            currentAudio = newAudio;

            let fadeOutTriggered = false;
            newAudio.ontimeupdate = () => {
                if (currentAudio === newAudio && newAudio.duration) {
                    const progressBar = document.getElementById(`tprogress-${idx}`);
                    if (progressBar) progressBar.style.width = `${(newAudio.currentTime / newAudio.duration) * 100}%`;

                    if (newAudio.duration - newAudio.currentTime <= 0.8 && !fadeOutTriggered) {
                        fadeOutTriggered = true;
                        let vol = newAudio.volume;
                        const fadeInterval = setInterval(() => {
                            if (newAudio && newAudio.volume > 0.05) {
                                newAudio.volume = Math.max(0, newAudio.volume - 0.1);
                            } else {
                                clearInterval(fadeInterval);
                            }
                        }, 40);
                    }
                }
            };
            
            newAudio.onended = async () => {
                if (currentAudio !== newAudio) return;
                await sleep(600);
                resetTournamentSlotUI(idx);
                const nextIdx = getNextAvailableSlot(currentMatchAlbums, idx, 1);
                
                if (nextIdx === 0) {
                    for (let i = 0; i < currentMatchAlbums.length; i++) {
                        currentMatchAlbums[i] = await fetchHitTrackForAlbum(currentMatchAlbums[i], true, true);
                    }
                    renderBattleMatchUI();
                }
                
                playTournamentCarouselTrack(nextIdx);
            };

            newAudio.onerror = async () => {
                if (currentAudio !== newAudio) return;
                resetTournamentSlotUI(idx);
                currentMatchAlbums[idx] = await fetchHitTrackForAlbum(currentMatchAlbums[idx], true, true);
                renderBattleMatchUI();
                playNextMatchTrackInCarousel(idx);
            };

            newAudio.play().then(() => {
                if (currentAudio === newAudio) fadeInAudio(newAudio, 1.0, 500);
            }).catch(e => {
                if (currentAudio !== newAudio) return;
                resetTournamentSlotUI(idx);
                playNextMatchTrackInCarousel(idx);
            });
        }

        function playNextMatchTrackInCarousel(fromIdx) {
            if (currentMatchAlbums.length === 0) return;
            const nextIdx = getNextAvailableSlot(currentMatchAlbums, fromIdx, 1);
            if (nextIdx !== fromIdx) playTournamentCarouselTrack(nextIdx);

            const card = document.getElementById(`tcard-${idx}`);

            currentMatchVotes[idx] = Math.max(0, currentMatchVotes[idx] + delta);

            if (valSpan) valSpan.innerText = `${currentMatchVotes[idx]} votes`;
            updateProbabilityBar();
        }

        function calculateProbabilities() {
            let weights = currentMatchAlbums.map((album, idx) => {
                const baseScore = parseFloat(album.score) || 3.0;
                const scoreWeight = baseScore * 10;
                const voteWeight = currentMatchVotes[idx] * 100;
                return scoreWeight + voteWeight;
            });

            const totalWeight = weights.reduce((a, b) => a + b, 0);
            return weights.map(w => (w / totalWeight));
        }

        function updateProbabilityBar() {
            const bar = document.getElementById('probabilityBar');
            bar.innerHTML = '';
            const probs = calculateProbabilities();

            probs.forEach((p, idx) => {
                const seg = document.createElement('div');
                seg.className = 'probability-segment';
                seg.style.width = `${p * 100}%`;
                seg.style.backgroundColor = SEGMENT_COLORS[idx % SEGMENT_COLORS.length];
                seg.title = `${currentMatchAlbums[idx].title}: ${(p * 100).toFixed(1)}%`;
                bar.appendChild(seg);
            });
        }

        async function rollDiceAndDetermineWinner() {
            const btn = document.getElementById('btnRollDice');
            btn.disabled = true;

            if (currentPlayingSlot !== null) {
                resetTournamentSlotUI(currentPlayingSlot);
            }

            const probs = calculateProbabilities();
            const rand = Math.random();

            let cumulative = 0;
            let winnerIdx = 0;

            for (let i = 0; i < probs.length; i++) {
                cumulative += probs[i];
                if (rand <= cumulative) {
                    winnerIdx = i;
                    break;
                }
            }

            const totalRemaining = tournBracket.length + currentMatchAlbums.length + tournNextRound.length;

            const remainingInBracket = tournBracket.length + tournNextRound.length;
            let totalTicks = 8;
            if (remainingInBracket <= 4) totalTicks = 22;
            else if (remainingInBracket <= 12) totalTicks = 14;

            for (let t = 0; t < totalTicks; t++) {
                const flashIdx = t % currentMatchAlbums.length;
                currentMatchAlbums.forEach((_, i) => {
                    const c = document.getElementById(`tcard-${i}`);
                    if (c) {
                        c.classList.toggle('winner-glow', i === flashIdx);
                        c.classList.remove('loser-dimmed');
                    }
                });
                await sleep(80 + t * 15);
            }

            if (isBlindMode) {
                currentMatchAlbums.forEach((_, i) => {
                    if (i !== winnerIdx && !revealedSlots.includes(i)) {
                        revealedSlots.push(i);
                    }
                });
                renderBattleMatchUI();
                
                await sleep(1200);
            }

            currentMatchAlbums.forEach((_, i) => {
                const c = document.getElementById(`tcard-${i}`);
                if (c) {
                    if (i === winnerIdx) {
                        c.classList.add('winner-glow');
                        c.classList.remove('loser-dimmed');
                    } else {
                        c.classList.remove('winner-glow');
                        c.classList.add('loser-dimmed');
                    }
                }
            });

            const stageName = getPlayoffStageTitle(totalRemaining);
            currentMatchAlbums.forEach((album, idx) => {
                if (idx !== winnerIdx) {
                    tournamentEliminationLog.push({
                        album: album,
                        eliminatedAtStage: stageName,
                        remainingAtElimination: totalRemaining
                    });
                }
            });

            await sleep(2000);

            const winnerAlbum = currentMatchAlbums[winnerIdx];
            tournNextRound.push(winnerAlbum);
            currentMatchNumber++;

            loadNextMatch();
        }

        async function playChampionNextTrack(forceRandom = true, event = null) {
            if (event) event.stopPropagation();

            const display = document.getElementById('champ-track-display');
            if (display) display.innerHTML = `<div class="track-preview-name" style="color:#eab308;">⏳ Loading track...</div>`;

            const refreshedData = await fetchHitTrackForAlbum(championAlbumObj, forceRandom, true);
            championAlbumObj = refreshedData;
            
            if (display) display.innerHTML = `<div class="track-preview-name" title="${escapeHtml(refreshedData.trackName)}">🎵 ${escapeHtml(refreshedData.trackName)}</div>`;
            playChampionTrack();
        }

        async function playChampionTrack() {
            await fadeAndStopAudio();
            if (!championAlbumObj || !championAlbumObj.preview) return;

            currentPlayingId = `champ_${championAlbumObj.id}`;
            const card = document.getElementById('champion-card-el');
            const icon = document.getElementById('champ-play-icon');
            const progressBar = document.getElementById('champ-progress-fill');

            if (card) {
                card.classList.add('playing');
                if (window.innerWidth <= 600) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
            if (icon) icon.innerHTML = '<svg viewBox="0 0 24 24" style="padding-right:0;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

            currentAudio = new Audio(championAlbumObj.preview);
            
            let fadeOutTriggered = false;
            currentAudio.ontimeupdate = () => {
                if (currentAudio && currentAudio.duration) {
                    if (progressBar) progressBar.style.width = `${(currentAudio.currentTime / currentAudio.duration) * 100}%`;

                    if (currentAudio.duration - currentAudio.currentTime <= 0.8 && !fadeOutTriggered) {
                        fadeOutTriggered = true;
                        let vol = currentAudio.volume;
                        const fadeInterval = setInterval(() => {
                            if (currentAudio && currentAudio.volume > 0.05) {
                                currentAudio.volume = Math.max(0, currentAudio.volume - 0.1);
                            } else {
                                clearInterval(fadeInterval);
                            }
                        }, 40);
                    }
                }
            };

            currentAudio.onended = async () => {
                await sleep(600);
                if (card) card.classList.remove('playing');
                if (icon) icon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
                playChampionNextTrack(true);
            };

            currentAudio.play().then(() => {
                fadeInAudio(currentAudio, 1.0, 500);
            }).catch(e => {
                if (card) card.classList.remove('playing');
                if (icon) icon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
            });
        }

        function showChampionScreen(champion) {
            stopCurrentAudio();
            addToCollectionDataOnly(champion);
            saveProgress();
            renderCollectionUI();
            updateTournamentSourceDropdown();

            document.getElementById('battleArena').classList.add('hidden');
            document.getElementById('winnerScreen').classList.remove('hidden');

            renderChampionCardUI(champion);
            renderTournamentStandingsUI(champion);
        }

        function abortTournament() {
            if (confirm('Abort current tournament?')) {
                resetTournamentUI();
            }
        }

        function resetTournamentUI() {
            stopCurrentAudio();
            championAlbumObj = null;
            tournamentEliminationLog = [];
            revealedSlots = [];
            document.getElementById('battleArena').classList.add('hidden');
            document.getElementById('winnerScreen').classList.add('hidden');
            document.getElementById('tournamentSetup').classList.remove('hidden');
            updateTournamentSourceDropdown();
        }

        window.onload = loadDatabase;
    </script>
</body>
</html>
